<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泊寓门店展示 - 编辑器</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
  background: #F0F2F5;
  color: #1D1D1F;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Top Bar ── */
.topbar {
  background: #fff;
  border-bottom: 1px solid #E5E7EB;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar h1 { font-size: 16px; font-weight: 700; color: #111; }
.topbar-actions { display: flex; gap: 8px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
.btn-p { background: #4361EE; color: #fff; }
.btn-p:hover { background: #3A56D4; }
.btn-o { background: #fff; color: #4361EE; border: 1px solid #4361EE; }
.btn-o:hover { background: #EEF2FF; }
.btn-g { background: #E8F5E9; color: #2E7D32; }
.btn-g:hover { background: #C8E6C9; }
.btn-d { background: #FFF3E0; color: #E65100; }
.btn-d:hover { background: #FFE0B2; }

/* ── Main Layout ── */
.shell {
  display: flex;
  height: calc(100vh - 53px);
}
.col-edit {
  width: 46%;
  min-width: 380px;
  overflow-y: auto;
  padding: 20px;
  background: #F8F9FA;
}
.col-prev {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: #fff;
  border-left: 1px solid #E5E7EB;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  background: #fff;
  padding: 4px;
  border-radius: 10px;
  border: 1px solid #E5E7EB;
}
.tab-btn {
  flex: 1;
  padding: 8px 12px;
  border: none;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  background: transparent;
  color: #6B7280;
  transition: all .15s;
}
.tab-btn.on { background: #4361EE; color: #fff; }
.tab-btn:hover:not(.on) { background: #F3F4F6; }

.panel { display: none; }
.panel.on { display: block; }

/* ── Cards ── */
.card {
  background: #fff;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 12px;
}
.card h3 {
  font-size: 14px;
  font-weight: 600;
  color: #111;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid #F3F4F6;
}

/* ── Form Fields ── */
.fr { margin-bottom: 12px; }
.fr label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: #374151;
  margin-bottom: 4px;
}
.fr input[type="text"], .fr textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #D1D5DB;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  color: #1D1D1F;
  background: #fff;
  transition: border-color .15s;
}
.fr input[type="text"]:focus, .fr textarea:focus {
  outline: none;
  border-color: #4361EE;
  box-shadow: 0 0 0 3px rgba(67,97,238,.1);
}
.fr textarea { resize: vertical; min-height: 60px; }
.fg { display: flex; gap: 12px; }
.fg > .fr { flex: 1; }
.hint { font-size: 11px; color: #9CA3AF; margin-top: 4px; }

/* ── Checkbox Group ── */
.cbg { display: flex; flex-wrap: wrap; gap: 8px; }
.cbg label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}
.cbg label:hover { background: #F3F4F6; }

/* ── Image Upload ── */
.upload-field { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.upload-thumb {
  width: 80px; height: 80px;
  border-radius: 8px;
  object-fit: cover;
  border: 1px solid #E5E7EB;
  background: #F9FAFB;
  flex-shrink: 0;
}
.upload-controls { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: #4361EE;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 12.5px;
  cursor: pointer;
  font-family: inherit;
}
.upload-btn:hover { background: #3A56D4; }
.upload-remove {
  padding: 5px 10px;
  background: #fff;
  color: #E63946;
  border: 1px solid #FECDD3;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
}
.upload-remove:hover { background: #FFF1F2; }
.upload-hint { font-size: 11px; color: #9CA3AF; margin-top: 2px; }

/* ── Preview ── */
.prev-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.prev-head h3 { font-size: 14px; font-weight: 600; }
.style-row {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.st-btn {
  flex: 1;
  padding: 8px 10px;
  border: 1px solid #E5E7EB;
  border-radius: 8px;
  background: #fff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
.st-btn.on { background: #4361EE; color: #fff; border-color: #4361EE; }
.st-btn:hover:not(.on) { background: #F9FAFB; }
.prev-frame {
  width: 100%;
  height: 60vh;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  background: #F9FAFB;
}

/* ── Export ── */
.export-card { background: linear-gradient(135deg, #F8F9FA, #EEF2FF); border-color: #C7D2FE; }
.export-card h3 { color: #4361EE; border-color: #C7D2FE; }
.bg { display: flex; gap: 8px; flex-wrap: wrap; }
.info-box {
  background: #FFF9C4;
  border: 1px solid #FFE082;
  border-radius: 8px;
  padding: 12px;
  margin-top: 12px;
  font-size: 12px;
  color: #5D4037;
  line-height: 1.7;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1D1D1F;
  color: #fff;
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  z-index: 9999;
  transition: transform .3s;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 768px) {
  .shell { flex-direction: column; }
  .col-edit { width: 100%; min-width: auto; height: auto; }
  .col-prev { border-left: none; border-top: 1px solid #E5E7EB; }
  .prev-frame { height: 50vh; }
}

/* ── Unit Image Upload ── */
.unit-image-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed #E5E7EB;
}
.unit-image-thumb {
  width: 64px;
  height: 64px;
  border-radius: 6px;
  object-fit: cover;
  border: 1px solid #E5E7EB;
  background: #F9FAFB;
  flex-shrink: 0;
}
.unit-image-label {
  font-size: 12px;
  font-weight: 500;
  color: #374151;
  margin-bottom: 6px;
}
.unit-image-controls { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.unit-img-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  background: #4361EE;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
}
.unit-img-btn:hover { background: #3A56D4; }
.unit-img-remove {
  padding: 4px 8px;
  background: #fff;
  color: #E63946;
  border: 1px solid #FECDD3;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
}
.unit-img-remove:hover { background: #FFF1F2; }


/* ── Amenity Card Layout ── */
.amenity-card-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.amenity-card {
  border: 1px solid #E5E7EB;
  border-radius: 10px;
  background: #fff;
  overflow: hidden;
  transition: all .2s;
}
.amenity-card.active {
  border-color: #4361EE;
  background: #F8FAFF;
}
.amenity-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
  user-select: none;
}
.amenity-card-header:hover { background: #F9FAFB; }
.amenity-card-header input[type="checkbox"] {
  width: 16px; height: 16px;
  accent-color: #4361EE;
  cursor: pointer;
  flex-shrink: 0;
}
.amenity-card-emoji { font-size: 18px; flex-shrink: 0; }
.amenity-card-name {
  font-size: 13px; font-weight: 500;
  color: #374151; flex: 1;
}
.amenity-card-del {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  background: #FFF1F2; color: #E63946;
  border: 1px solid #FECDD3;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
}
.amenity-card-del:hover { background: #FFE4E6; }
.amenity-card-body {
  display: none;
  padding: 0 14px 12px 40px;
  border-top: 1px dashed #E5E7EB;
  padding-top: 10px;
}
.amenity-card.active .amenity-card-body { display: block; }
.amenity-card-body .upload-field { margin-top: 0; }

/* ── Custom Amenity Input ── */
.custom-amenity-row {
  display: flex; gap: 8px; margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed #E5E7EB;
}
.custom-amenity-row input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid #D1D5DB;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
}
.custom-amenity-row input:focus {
  outline: none;
  border-color: #4361EE;
  box-shadow: 0 0 0 3px rgba(67,97,238,.1);
}
.custom-amenity-btn {
  padding: 8px 16px;
  background: #10B981;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.custom-amenity-btn:hover { background: #059669; }

/* ── Social Media Card Styles ── */
.social-cards-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.social-card {
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 10px;
  padding: 14px;
}
.social-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.social-card-icon { font-size: 20px; }
.social-card-title { font-size: 13px; font-weight: 600; color: #111; }
.social-card .fr { margin-bottom: 10px; }
.social-card .fr label { font-size: 11px; }
.social-card-preview {
  margin-top: 8px;
  text-align: center;
}
.social-card-preview img {
  width: 80px; height: 80px;
  border-radius: 8px;
  border: 2px solid #E5E7EB;
  padding: 2px;
  background: #fff;
  object-fit: cover;
}
.social-card-preview-hint {
  font-size: 11px; color: #9CA3AF;
  margin-top: 4px;
}

/* ── Unit Image Enlarged (需求3) ── */
.unit-image-thumb {
  width: 80px !important;
  height: 60px !important;
}

/* ── Pricing Tab Styles (需求5) ── */
.pricing-toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid #F3F4F6;
}
.pricing-toggle-label {
  font-size: 14px; font-weight: 600; color: #111;
}
.switch {
  position: relative;
  width: 44px;
  height: 24px;
  cursor: pointer;
}
.switch input { opacity: 0; width: 0; height: 0; }
.switch-slider {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #D1D5DB;
  border-radius: 24px;
  transition: .2s;
}
.switch-slider::before {
  content: '';
  position: absolute;
  width: 18px; height: 18px;
  left: 3px; bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: .2s;
}
.switch input:checked + .switch-slider { background: #4361EE; }
.switch input:checked + .switch-slider::before { transform: translateX(20px); }
.pricing-fields { display: none; }
.pricing-fields.show { display: block; }
.payment-checks {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.payment-checks label {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}
.payment-checks label:hover { background: #F3F4F6; }
.payment-checks input { accent-color: #4361EE; }
.pricing-badge-preview {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px;
  background: #EEF2FF;
  color: #4361EE;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
  margin: 2px;
}

/* ── Print styles for PDF export ── */
@media print {
  @page { size: A4; margin: 12mm; }
  body * { visibility: hidden; }
  .col-prev, .col-prev * { visibility: visible; }
  .col-prev {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    padding: 0 !important;
    border: none !important;
  }
  .prev-head, .style-row, .export-card, .topbar, .col-edit, .toast, .tabs, .card { display: none !important; }
  .prev-frame {
    width: 100% !important;
    height: auto !important;
    min-height: 100vh !important;
    border: none !important;
    border-radius: 0 !important;
  }
}


/* ── Linked Amenity Upload ── */
.amenity-linked-list { display: flex; flex-direction: column; gap: 0; }
.amenity-linked-item {
  border: 1px solid #E5E7EB;
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: all .2s;
}
.amenity-linked-item.active { border-color: #4361EE; background: #F8FAFF; }
.amenity-linked-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
}
.amenity-linked-header:hover { background: #F9FAFB; }
.amenity-linked-header input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: #4361EE;
  cursor: pointer;
}
.amenity-linked-label {
  font-size: 13px;
  font-weight: 500;
  color: #374151;
  flex: 1;
}
.amenity-linked-body {
  display: none;
  padding: 0 14px 12px 40px;
  border-top: 1px dashed #E5E7EB;
  padding-top: 10px;
  margin-top: 0;
}
.amenity-linked-item.active .amenity-linked-body { display: block; }
.amenity-checkbox-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px dashed #E5E7EB;
}
.amenity-checkbox-row label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.amenity-checkbox-row label:hover { background: #F3F4F6; }
.amenity-checkbox-row input[type="checkbox"] {
  accent-color: #4361EE;
}

</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <h1>🏠 泊寓门店展示工具</h1>
  <div class="topbar-actions">
    <button type="button" class="btn btn-o" id="btnSaveJson">📂 加载JSON</button>
    <button type="button" class="btn btn-g" id="btnCopyShare">📋 复制分享链接</button>
    <button type="button" class="btn btn-d" id="btnSample">📝 填充示例</button>
    <button type="button" class="btn btn-o" id="btnReset">🗑️ 重置</button>
  </div>
</div>

<!-- Main -->
<div class="shell">
  <!-- Left: Editor -->
  <div class="col-edit">
    <div class="tabs">
      <button type="button" class="tab-btn on" data-tab="basic">基本信息</button>
      <button type="button" class="tab-btn" data-tab="amenities">房源配套</button>
      <button type="button" class="tab-btn" data-tab="location">位置联系</button>
      <button type="button" class="tab-btn" data-tab="pricing">收费标准</button>
    </div>

    <!-- TAB: 基本信息 -->
    <div class="panel on" id="p-basic">
      <div class="card">
        <h3>品牌信息</h3>
        <div class="fr"><label>品牌名称</label><input type="text" id="f_brandName" placeholder="交投泊寓"></div>
        <div class="fr"><label>品牌 Slogan</label><input type="text" id="f_brandSlogan" placeholder="城市青年社区"></div>
        <div class="fr"><label>品牌 Logo</label>
          <div class="upload-field">
            <img id="thumb_brandLogo" class="upload-thumb" style="display:none" alt="">
            <div class="upload-controls">
              <button type="button" class="upload-btn" data-key="brandLogo">📁 选择图片</button>
              <button type="button" class="upload-remove" data-key="brandLogo" style="display:none">✕ 移除</button>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>项目信息</h3>
        <div class="fr"><label>项目名称</label><input type="text" id="f_projectName" placeholder="花山河店"></div>
        <div class="fr"><label>所在城市</label><input type="text" id="f_city" placeholder="武汉"></div>
        <div class="fr"><label>项目标语</label><input type="text" id="f_tagline" placeholder="在城市的心脏，找到你的节奏"></div>
        <div class="fr"><label>项目简介</label><textarea id="f_description" rows="3" placeholder="一段描述项目特色和氛围的文字..."></textarea></div>
        <div class="fr"><label>主视觉图</label>
          <div class="upload-field">
            <img id="thumb_heroImage" class="upload-thumb" style="width:140px;height:80px;display:none" alt="">
            <div class="upload-controls">
              <button type="button" class="upload-btn" data-key="heroImage">📁 选择主视觉图</button>
              <button type="button" class="upload-remove" data-key="heroImage" style="display:none">✕ 移除</button>
              <div class="upload-hint">建议 16:9 横版</div>
            </div>
          </div>
        </div>
      </div>
    </div>

        <!-- TAB: 房源配套 -->
    <div class="panel" id="p-amenities">
      <div class="card">
        <h3>房源数据</h3>
        <div class="fg">
          <div class="fr"><label>总房间数</label><input type="text" id="f_totalRooms" placeholder="696"></div>
          <div class="fr"><label>户型面积</label><input type="text" id="f_unitRange" placeholder="15-37㎡"></div>
        </div>
        <div class="fr"><label>楼栋信息</label><textarea id="f_buildings" rows="2" placeholder="G10栋 · 288间&#10;G11栋 · 408间"></textarea></div>
        <div class="fr"><label>租金范围（起价）</label><input type="text" id="f_priceRange" placeholder="746元/月起"></div>
      </div>
      <div class="card">
        <h3>户型列表</h3>
        <div id="unitList"></div>
        <button type="button" class="btn btn-o" id="btnAddUnit" style="margin-top:8px;font-size:12px">+ 添加户型</button>
      </div>
      <div class="card">
        <h3>公共配套 <span style="font-size:11px;color:#9CA3AF;font-weight:400">勾选后可上传对应图片</span></h3>
        <div class="amenity-card-grid" id="amenityCardGrid"></div>
        <div class="custom-amenity-row">
          <input type="text" id="customAmenityInput" placeholder="输入自定义配套名称，如：瑜伽室、宠物区...">
          <button type="button" class="custom-amenity-btn" id="btnAddCustomAmenity">+ 添加配套</button>
        </div>
      </div>
      <div class="card">
        <h3>地图与二维码</h3>
        <div id="mapQrFields"></div>
      </div>
      <div class="card">
        <h3>社媒推广</h3>

  d.heroImage = imageStore.heroImage || '';
  for(i=0;i<MEDIA.length;i++){
    d.media[MEDIA[i]] = imageStore[MEDIA[i]] || '';
  }
  // Collect amenities from card grid
  var amenCards = document.querySelectorAll('.amenity-card');
  for(i=0;i<amenCards.length;i++){
    var cb = amenCards[i].querySelector('input[type="checkbox"]');
    if(cb && cb.checked){
      d.amenities.push(cb.value);
    }
  }
  // Collect custom amenities
  var customCards = document.querySelectorAll('.amenity-card[data-custom="1"]');
  for(i=0;i<customCards.length;i++){
    var cb2 = customCards[i].querySelector('input[type="checkbox"]');
    if(cb2){
      var cname = cb2.value.replace(/^custom:/, '');
      if(cname) d.customAmenities.push(cname);
      // Ensure custom amenity image is in media
      var ckey = customCards[i].dataset.key;
      if(ckey) d.media[ckey] = imageStore[ckey] || '';
    }
  }
  var uin = document.querySelectorAll('.unit-in');
  for(i=0;i<uin.length;i++){
    var idx=parseInt(uin[i].dataset.idx,10), field=uin[i].dataset.field;
    if(!d.units[idx]) d.units[idx]={name:'',area:'',price:'',desc:''};
    d.units[idx][field] = uin[i].value;
  }
  // Collect unit images (unit_0, unit_1, ...)
  for(var ui=0; ui<d.units.length; ui++){
    var ukey = 'unit_'+ui;
    d.media[ukey] = imageStore[ukey] || '';
  }
  // Pricing
  var enableEl = document.getElementById('f_enablePricing');
  d.enablePricing = enableEl ? enableEl.checked : false;
  d.pricing = {
    water: getVal('f_pricing_water'),
    electricity: getVal('f_pricing_electricity'),
    network: getVal('f_pricing_network'),
    service: getVal('f_pricing_service'),
    payment: [],
    leaseTerm: getVal('f_pricing_leaseTerm'),
    deposit: getVal('f_pricing_deposit'),
    remark: getVal('f_pricing_remark')
  };
  var payChecks = document.querySelectorAll('#paymentChecks input:checked');
  for(var pi=0; pi<payChecks.length; pi++){
    d.pricing.payment.push(payChecks[pi].value);
  }
  return d;
}

}

/* ── Fill form ── */
function fillForm(d){
  var i,el;
  for(i=0;i<STRAIGHT.length;i++){
    el = document.getElementById('f_'+STRAIGHT[i]);
    if(el && d[STRAIGHT[i]]!==undefined) el.value = d[STRAIGHT[i]];
  }
  imageStore.brandLogo = d.brandLogo || '';
  imageStore.heroImage = d.heroImage || '';
  loadImagePreview('brandLogo', imageStore.brandLogo);
  loadImagePreview('heroImage', imageStore.heroImage);

  // Load custom amenities first (so their media keys exist)
  var customNames = d.customAmenities || [];
  for(var ci=0; ci<customNames.length; ci++){
    var ckey = 'custom_' + ci;
    if(imageStore[ckey] === undefined) imageStore[ckey] = '';
  }

  // Load all media including custom amenity images
  if(d.media){
    for(var mk in d.media){
      if(d.media.hasOwnProperty(mk)){
        imageStore[mk] = d.media[mk] || '';
      }
    }
  }
  for(i=0;i<MEDIA.length;i++){
    var val = imageStore[MEDIA[i]] || '';
    loadImagePreview(MEDIA[i], val);
  }

  // Render amenity cards with preset + custom
  renderAmenityCards(d.amenities || [], customNames, d.media || {});

  // Load unit images from media into imageStore
  if(d.media){
    var uk = 0;
    while(d.media['unit_'+uk] !== undefined){
      imageStore['unit_'+uk] = d.media['unit_'+uk] || '';
      uk++;
    }
  }
  renderUnits(d.units || []);
  // Refresh unit thumb previews after render (since render builds DOM)
  var unitCount = (d.units || []).length;
  for(var ui=0; ui<unitCount; ui++){
    var ukey = 'unit_'+ui;
    loadImagePreview(ukey, imageStore[ukey] || '');
  }
  // Pricing fields
  var enableEl = document.getElementById('f_enablePricing');
  var enablePricing = d.enablePricing || false;
  if(enableEl) enableEl.checked = enablePricing;
  togglePricingFields(enablePricing);
  var p = d.pricing || {};
  setVal('f_pricing_water', p.water || '');
  setVal('f_pricing_electricity', p.electricity || '');
  setVal('f_pricing_network', p.network || '');
  setVal('f_pricing_service', p.service || '');
  setVal('f_pricing_leaseTerm', p.leaseTerm || '');
  setVal('f_pricing_deposit', p.deposit || '');
  setVal('f_pricing_remark', p.remark || '');
  var pays = p.payment || [];
  var payChecks = document.querySelectorAll('#paymentChecks input[type="checkbox"]');
  for(var pi=0; pi<payChecks.length; pi++){
    payChecks[pi].checked = pays.indexOf(payChecks[pi].value) >= 0;
  }
}

  var el = document.getElementById(id);
  if(el) el.value = val;
}

/* ── Image Compression ── */
function compressImage(file, maxW, maxH, quality, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var w=img.width, h=img.height;
      var ratio = Math.min(maxW/w, maxH/h, 1);
      w=Math.round(w*ratio); h=Math.round(h*ratio);
      var canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ toast('❌ 图片读取失败'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ── Image Preview ── */
function loadImagePreview(key, dataUrl){
  var thumb = document.getElementById('thumb_'+key);
  var removeBtn = document.querySelector('.upload-remove[data-key="'+key+'"]');
  var unitRemoveBtn = document.querySelector('.unit-img-remove[data-key="'+key+'"]');
  if(thumb){
    if(dataUrl){
      thumb.src = dataUrl;
      thumb.style.display = 'block';
      if(removeBtn) removeBtn.style.display = '';
      if(unitRemoveBtn) unitRemoveBtn.style.display = '';
    } else {
      thumb.src = '';
      thumb.style.display = 'none';
      if(removeBtn) removeBtn.style.display = 'none';
      if(unitRemoveBtn) unitRemoveBtn.style.display = 'none';
    }
  }
  // Update social card preview
  if(key === 'xiaohongshu' || key === 'gongzhonghao'){
    var card = document.querySelector('.social-card-preview');
    // Find all social card previews and update matching one
    var cards = document.querySelectorAll('.social-card');
    for(var i=0; i<cards.length; i++){
      var btn = cards[i].querySelector('.upload-btn[data-key="'+key+'"]');
      if(btn){
        var prev = cards[i].querySelector('.social-card-preview');
        if(prev){
          if(dataUrl){
            prev.innerHTML = '<img src="'+dataUrl+'" alt="二维码预览">';
          } else {
            prev.innerHTML = '<div class="social-card-preview-hint">上传后显示预览</div>';
          }
        }
      }
    }
  }
}

/* ── Render Amenity Cards (需求1+4) ── */
function renderAmenityCards(checkedAmenities, customNames, mediaData){
  var grid = document.getElementById('amenityCardGrid');
  if(!grid) return;
  var html = '';
  // Preset amenities
  for(var i=0; i<AMENITY_PRESETS.length; i++){
    var p = AMENITY_PRESETS[i];
    var isChecked = checkedAmenities.indexOf(p.name) >= 0;
    html += buildAmenityCard(p.key, p.name, p.emoji, isChecked, false, mediaData);
  }
  // Custom amenities
  for(var ci=0; ci<customNames.length; ci++){
    var cname = customNames[ci];
    var ckey = 'custom_' + ci;
    var cchecked = checkedAmenities.indexOf('custom:' + cname) >= 0 || checkedAmenities.indexOf(cname) >= 0;
    html += buildAmenityCard(ckey, cname, '⭐', cchecked, true, mediaData);
  }
  grid.innerHTML = html;
}
function buildAmenityCard(key, name, emoji, checked, isCustom, mediaData){
  var val = isCustom ? 'custom:' + name : name;
  var imgData = (mediaData && mediaData[key]) ? mediaData[key] : (imageStore[key] || '');
  var h = '<div class="amenity-card '+(checked?'active':'')+'" data-key="'+key+'"'+(isCustom?' data-custom="1"':'')+'>';
  h += '<div class="amenity-card-header">';
  h += '<input type="checkbox" value="'+escAttr(val)+'" '+(checked?'checked':'')+'>';
  h += '<span class="amenity-card-emoji">'+emoji+'</span>';
  h += '<span class="amenity-card-name">'+name+'</span>';
  if(isCustom){
    h += '<button type="button" class="amenity-card-del" data-del-key="'+key+'" title="删除">×</button>';
  }
  h += '</div>';
  h += '<div class="amenity-card-body">';
  h += '<div class="upload-field">';
  h += '<img id="thumb_'+key+'" class="upload-thumb" '+(imgData?'src="'+escAttr(imgData)+'"':'style="display:none"')+' alt="'+name+'">';
  h += '<div class="upload-controls">';
  h += '<button type="button" class="upload-btn" data-key="'+key+'">📁 选择图片</button>';
  h += '<button type="button" class="upload-remove" data-key="'+key+'" '+(imgData?'':'style="display:none"')+'>✕ 移除</button>';
  h += '<div class="upload-hint">建议 4:3 横版</div>';
  h += '</div></div></div></div>';
  return h;
}

/* ── Amenity Card Interactions ── */
function initAmenityCards(){
  var grid = document.getElementById('amenityCardGrid');
  if(!grid) return;
  // Toggle card active state on checkbox change
  grid.addEventListener('change', function(e){
    if(e.target.type === 'checkbox'){
      var card = e.target.closest('.amenity-card');
      if(!card) return;
      if(e.target.checked){
        card.classList.add('active');
      } else {
        card.classList.remove('active');
      }
      save();
      refreshPreview();
    }
  });
  // Delete custom amenity
  grid.addEventListener('click', function(e){
    if(e.target.classList.contains('amenity-card-del')){
      var dkey = e.target.dataset.delKey;
      var card = e.target.closest('.amenity-card');
      if(card){
        card.remove();
        if(imageStore[dkey] !== undefined) delete imageStore[dkey];
        save();
        refreshPreview();
      }
    }
  });
  // Add custom amenity
  var addBtn = document.getElementById('btnAddCustomAmenity');
  if(addBtn){
    addBtn.addEventListener('click', function(){
      var input = document.getElementById('customAmenityInput');
      var name = input ? input.value.trim() : '';
      if(!name){ toast('请输入配套名称'); return; }
      // Check for duplicates
      var existing = document.querySelectorAll('.amenity-card .amenity-card-name');
      for(var i=0;i<existing.length;i++){
        if(existing[i].textContent === name){ toast('该配套已存在'); return; }
      }
      // Find next custom index
      var customCards = document.querySelectorAll('.amenity-card[data-custom="1"]');
      var nextIdx = customCards.length;
      var ckey = 'custom_' + nextIdx;
      imageStore[ckey] = '';
      var grid = document.getElementById('amenityCardGrid');
      var newCard = buildAmenityCard(ckey, name, '⭐', true, true, {});
      grid.insertAdjacentHTML('beforeend', newCard);
      input.value = '';
      save();
      refreshPreview();
    });
  }
}

/* ── Image Upload Events ── */
function initImageUploads(){
  document.addEventListener('click', function(e){
    var isUploadBtn = e.target.classList.contains('upload-btn');
    var isUnitImgBtn = e.target.classList.contains('unit-img-btn');
    if(isUploadBtn || isUnitImgBtn){
      var key = e.target.dataset.key;
      var inp = document.createElement('input');
      inp.type='file'; inp.accept='image/jpeg,image/png,image/webp';
      inp.onchange = function(ev){
        var file = ev.target.files[0];
        if(!file) return;
        compressImage(file, 1200, 1200, 0.82, function(dataUrl){
          imageStore[key] = dataUrl;
          loadImagePreview(key, dataUrl);
          save();
          refreshPreview();
          toast('✅ 图片已上传');
        });
      };
      inp.click();
      return;
    }
    var isUploadRemove = e.target.classList.contains('upload-remove');
    var isUnitImgRemove = e.target.classList.contains('unit-img-remove');
    if(isUploadRemove || isUnitImgRemove){
      var key2 = e.target.dataset.key;
      imageStore[key2] = '';
      loadImagePreview(key2, '');
      save();
      refreshPreview();
      toast('已移除');
    }
  });
}

function exportPDF(){
  save();
  var tpl = TEMPLATES[curStyle] || TEMPLATES['warm-editorial'];
  var data = getData();
  var dataScript = '<scr'+'ipt>window.__STORE_DATA__='+JSON.stringify(data)+';<\/scr'+'ipt>';
  var fullHtml = tpl.replace(/<\/head>/i, dataScript + '\n</head>');
  // Add print-optimized styles
  var printStyles = '<style>@media print{@page{size:A4;margin:12mm}body{margin:0}html,body{width:100%}}</style>';
  fullHtml = fullHtml.replace(/<\/head>/i, printStyles + '\n</head>');
  var w = window.open('', '_blank');
  if(!w){ toast('❌ 请允许弹窗以导出PDF'); return; }
  w.document.open();
  w.document.write(fullHtml);
  w.document.close();
  // Wait for images to load then print
  function tryPrint(){
    if(w.document.readyState === 'complete'){
      setTimeout(function(){
        w.focus();
        w.print();
      }, 500);
    } else {
      setTimeout(tryPrint, 200);
    }
  }
  w.addEventListener('load', function(){
    setTimeout(function(){
      w.focus();
      w.print();
    }, 800);
  });
  setTimeout(tryPrint, 300);
  toast('📄 正在生成PDF，请在打印对话框中选择"另存为PDF"');
}

/* ── Copy Share Link (Copy exported HTML to clipboard) ── */
function copyShareLink(){
  save();
  var tpl = TEMPLATES[curStyle] || TEMPLATES['warm-editorial'];
  var data = getData();
  var dataScript = '<scr'+'ipt>window.__STORE_DATA__='+JSON.stringify(data)+';<\/scr'+'ipt>';
  var fullHtml = tpl.replace(/<\/head>/i, dataScript + '\n<\/head>');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(fullHtml).then(function(){
      toast('✅ 展示页HTML已复制到剪贴板');
    }).catch(function(){
      fallbackCopy(fullHtml);
    });
  } else {
    fallbackCopy(fullHtml);
  }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
    toast('✅ 展示页HTML已复制到剪贴板');
  }catch(e){
    toast('❌ 复制失败，请手动导出HTML');
  }
  document.body.removeChild(ta);
}

      var ps = document.querySelectorAll('.panel');
      for(var k=0;k<ps.length;k++) ps[k].classList.remove('on');
      document.getElementById('p-'+this.dataset.tab).classList.add('on');
    });
  }
  /* Styles */
  var stBtns = document.querySelectorAll('.st-btn');
  for(var i=0;i<stBtns.length;i++){
    stBtns[i].addEventListener('click', function(){
      for(var j=0;j<stBtns.length;j++) stBtns[j].classList.remove('on');
      this.classList.add('on');
      curStyle = this.dataset.style;
      refreshPreview();
    });
  }
  /* Auto-save */
  document.addEventListener('input', function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') save();
  });
  document.addEventListener('change', function(e){
    if(e.target.type==='checkbox') save();
  });
  /* Units */
  document.getElementById('btnAddUnit').addEventListener('click', function(){
    var d = getData();
    d.units.push({name:'',area:'',price:'',desc:''});
    var newIdx = d.units.length - 1;
    var newKey = 'unit_'+newIdx;
    if(imageStore[newKey] === undefined) imageStore[newKey] = '';
    renderUnits(d.units);
    save();
  });
  document.getElementById('unitList').addEventListener('click', function(e){
    if(e.target.classList.contains('unit-del')){
      var idx = parseInt(e.target.dataset.idx,10);
      var d = getData();
      d.units.splice(idx,1);
      renderUnits(d.units);
      save();
    }
  });
  /* Render amenity cards, social cards, map/qr fields */
  renderAmenityCards([], [], {});
  renderSocialCards();
  renderMapQrFields();
  initAmenityCards();
  initImageUploads();
  initPricing();
  /* Load data */
  var saved = load();
  if(saved && saved.brandName && saved.projectName){
    fillForm(saved);
  } else {
    fillForm(DEFAULTS);
    save();
  }
  /* Initial preview */
  refreshPreview();
  /* Buttons */
  document.getElementById('btnRefresh').addEventListener('click', refreshPreview);
  document.getElementById('btnCopyShare').addEventListener('click', copyShareLink);
  document.getElementById('btnSample').addEventListener('click', function(){
    if(confirm('确定用示例数据覆盖当前内容？')){
      fillForm(DEFAULTS);
      save();
      refreshPreview();
      toast('✅ 示例数据已填充');
    }
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(confirm('确定清除所有缓存并重置为默认数据？')){
      try{ localStorage.removeItem(SKEY); }catch(e){}
      fillForm(DEFAULTS);
      save();
      refreshPreview();
      toast('✅ 已重置');
    }
  });
  document.getElementById('btnExportHtml').addEventListener('click', exportHTML);
  document.getElementById('btnExportJson').addEventListener('click', exportJSON);
  document.getElementById('btnExportPdf').addEventListener('click', exportPDF);
  document.getElementById('btnSaveJson').addEventListener('click', function(){
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var d = JSON.parse(ev.target.result);
        fillForm(d);
        save();
        refreshPreview();
        toast('✅ 数据已加载');
      }catch(err){
        toast('❌ JSON解析失败');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
}

init();
})();
</script>
</body>
</html>
