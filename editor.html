<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泊寓门店展示 - 编辑器 v6</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
  background: #F0F2F5;
  color: #1D1D1F;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Top Bar ── */
.topbar {
  background: #fff;
  border-bottom: 1px solid #E5E7EB;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar h1 { font-size: 16px; font-weight: 700; color: #111; }
.topbar-actions { display: flex; gap: 8px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
.btn-p { background: #4361EE; color: #fff; }
.btn-p:hover { background: #3A56D4; }
.btn-o { background: #fff; color: #4361EE; border: 1px solid #4361EE; }
.btn-o:hover { background: #EEF2FF; }
.btn-g { background: #E8F5E9; color: #2E7D32; }
.btn-g:hover { background: #C8E6C9; }
.btn-d { background: #FFF3E0; color: #E65100; }
.btn-d:hover { background: #FFE0B2; }

/* ── Main Layout ── */
.shell {
  display: flex;
  height: calc(100vh - 53px);
}
.col-edit {
  width: 46%;
  min-width: 380px;
  overflow-y: auto;
  padding: 20px;
  background: #F8F9FA;
}
.col-prev {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: #fff;
  border-left: 1px solid #E5E7EB;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  background: #fff;
  padding: 4px;
  border-radius: 10px;
  border: 1px solid #E5E7EB;
}
.tab-btn {
  flex: 1;
  padding: 8px 12px;
  border: none;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  background: transparent;
  color: #6B7280;
  transition: all .15s;
}
.tab-btn.on { background: #4361EE; color: #fff; }
.tab-btn:hover:not(.on) { background: #F3F4F6; }

.panel { display: none; }
.panel.on { display: block; }

/* ── Cards ── */
.card {
  background: #fff;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 12px;
}
.card h3 {
  font-size: 14px;
  font-weight: 600;
  color: #111;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid #F3F4F6;
}

/* ── Form Fields ── */
.fr { margin-bottom: 12px; }
.fr label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: #374151;
  margin-bottom: 4px;
}
.fr input[type="text"], .fr textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #D1D5DB;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  color: #1D1D1F;
  background: #fff;
  transition: border-color .15s;
}
.fr input[type="text"]:focus, .fr textarea:focus {
  outline: none;
  border-color: #4361EE;
  box-shadow: 0 0 0 3px rgba(67,97,238,.1);
}
.fr textarea { resize: vertical; min-height: 60px; }
.fg { display: flex; gap: 12px; }
.fg > .fr { flex: 1; }
.hint { font-size: 11px; color: #9CA3AF; margin-top: 4px; }

/* ── Checkbox Group ── */
.cbg { display: flex; flex-wrap: wrap; gap: 8px; }
.cbg label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}
.cbg label:hover { background: #F3F4F6; }

/* ── Image Upload ── */
.upload-field { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.upload-thumb {
  width: 80px; height: 80px;
  border-radius: 8px;
  object-fit: cover;
  border: 1px solid #E5E7EB;
  background: #F9FAFB;
  flex-shrink: 0;
}
.upload-controls { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: #4361EE;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 12.5px;
  cursor: pointer;
  font-family: inherit;
}
.upload-btn:hover { background: #3A56D4; }
.upload-remove {
  padding: 5px 10px;
  background: #fff;
  color: #E63946;
  border: 1px solid #FECDD3;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
}
.upload-remove:hover { background: #FFF1F2; }
.upload-hint { font-size: 11px; color: #9CA3AF; margin-top: 2px; }

/* ── Preview ── */
.prev-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.prev-head h3 { font-size: 14px; font-weight: 600; }
.style-row {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.st-btn {
  flex: 1;
  padding: 8px 10px;
  border: 1px solid #E5E7EB;
  border-radius: 8px;
  background: #fff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
.st-btn.on { background: #4361EE; color: #fff; border-color: #4361EE; }
.st-btn:hover:not(.on) { background: #F9FAFB; }
.prev-frame {
  width: 100%;
  height: 60vh;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  background: #F9FAFB;
}

/* ── Export ── */
.export-card { background: linear-gradient(135deg, #F8F9FA, #EEF2FF); border-color: #C7D2FE; }
.export-card h3 { color: #4361EE; border-color: #C7D2FE; }
.bg { display: flex; gap: 8px; flex-wrap: wrap; }
.info-box {
  background: #FFF9C4;
  border: 1px solid #FFE082;
  border-radius: 8px;
  padding: 12px;
  margin-top: 12px;
  font-size: 12px;
  color: #5D4037;
  line-height: 1.7;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1D1D1F;
  color: #fff;
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  z-index: 9999;
  transition: transform .3s;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 768px) {
  .shell { flex-direction: column; }
  .col-edit { width: 100%; min-width: auto; height: auto; }
  .col-prev { border-left: none; border-top: 1px solid #E5E7EB; }
  .prev-frame { height: 50vh; }
}

/* ── Unit Image Upload ── */
.unit-image-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed #E5E7EB;
}
.unit-image-thumb {
  width: 64px;
  height: 64px;
  border-radius: 6px;
  object-fit: cover;
  border: 1px solid #E5E7EB;
  background: #F9FAFB;
  flex-shrink: 0;
}
.unit-image-label {
  font-size: 12px;
  font-weight: 500;
  color: #374151;
  margin-bottom: 6px;
}
.unit-image-controls { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.unit-img-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  background: #4361EE;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
}
.unit-img-btn:hover { background: #3A56D4; }
.unit-img-remove {
  padding: 4px 8px;
  background: #fff;
  color: #E63946;
  border: 1px solid #FECDD3;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
}
.unit-img-remove:hover { background: #FFF1F2; }


/* ── Amenity Card Layout ── */
.amenity-card-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.amenity-card {
  border: 1px solid #E5E7EB;
  border-radius: 10px;
  background: #fff;
  overflow: hidden;
  transition: all .2s;
}
.amenity-card.active {
  border-color: #4361EE;
  background: #F8FAFF;
}
.amenity-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
  user-select: none;
}
.amenity-card-header:hover { background: #F9FAFB; }
.amenity-card-header input[type="checkbox"] {
  width: 16px; height: 16px;
  accent-color: #4361EE;
  cursor: pointer;
  flex-shrink: 0;
}
.amenity-card-emoji { font-size: 18px; flex-shrink: 0; }
.amenity-card-name {
  font-size: 13px; font-weight: 500;
  color: #374151; flex: 1;
}
.amenity-card-del {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  background: #FFF1F2; color: #E63946;
  border: 1px solid #FECDD3;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
}
.amenity-card-del:hover { background: #FFE4E6; }
.amenity-card-body {
  display: none;
  padding: 0 14px 12px 40px;
  border-top: 1px dashed #E5E7EB;
  padding-top: 10px;
}
.amenity-card.active .amenity-card-body { display: block; }
.amenity-card-body .upload-field { margin-top: 0; }

/* ── Custom Amenity Input ── */
.custom-amenity-row {
  display: flex; gap: 8px; margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed #E5E7EB;
}
.custom-amenity-row input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid #D1D5DB;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
}
.custom-amenity-row input:focus {
  outline: none;
  border-color: #4361EE;
  box-shadow: 0 0 0 3px rgba(67,97,238,.1);
}
.custom-amenity-btn {
  padding: 8px 16px;
  background: #10B981;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.custom-amenity-btn:hover { background: #059669; }

/* ── Social Media Card Styles ── */
.social-cards-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.social-card {
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 10px;
  padding: 14px;
}
.social-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.social-card-icon { font-size: 20px; }
.social-card-title { font-size: 13px; font-weight: 600; color: #111; }
.social-card .fr { margin-bottom: 10px; }
.social-card .fr label { font-size: 11px; }
.social-card-preview {
  margin-top: 8px;
  text-align: center;
}
.social-card-preview img {
  width: 80px; height: 80px;
  border-radius: 8px;
  border: 2px solid #E5E7EB;
  padding: 2px;
  background: #fff;
  object-fit: cover;
}
.social-card-preview-hint {
  font-size: 11px; color: #9CA3AF;
  margin-top: 4px;
}

/* ── Unit Image Enlarged (需求3) ── */
.unit-image-thumb {
  width: 80px !important;
  height: 60px !important;
}

/* ── Pricing Tab Styles (需求5) ── */
.pricing-toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid #F3F4F6;
}
.pricing-toggle-label {
  font-size: 14px; font-weight: 600; color: #111;
}
.switch {
  position: relative;
  width: 44px;
  height: 24px;
  cursor: pointer;
}
.switch input { opacity: 0; width: 0; height: 0; }
.switch-slider {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #D1D5DB;
  border-radius: 24px;
  transition: .2s;
}
.switch-slider::before {
  content: '';
  position: absolute;
  width: 18px; height: 18px;
  left: 3px; bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: .2s;
}
.switch input:checked + .switch-slider { background: #4361EE; }
.switch input:checked + .switch-slider::before { transform: translateX(20px); }
.pricing-fields { display: none; }
.pricing-fields.show { display: block; }
.payment-checks {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.payment-checks label {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}
.payment-checks label:hover { background: #F3F4F6; }
.payment-checks input { accent-color: #4361EE; }
.pricing-badge-preview {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px;
  background: #EEF2FF;
  color: #4361EE;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
  margin: 2px;
}

/* ── Print styles for PDF export ── */
@media print {
  @page { size: A4; margin: 12mm; }
  body * { visibility: hidden; }
  .col-prev, .col-prev * { visibility: visible; }
  .col-prev {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    padding: 0 !important;
    border: none !important;
  }
  .prev-head, .style-row, .export-card, .topbar, .col-edit, .toast, .tabs, .card { display: none !important; }
  .prev-frame {
    width: 100% !important;
    height: auto !important;
    min-height: 100vh !important;
    border: none !important;
    border-radius: 0 !important;
  }
}


/* ── Linked Amenity Upload ── */
.amenity-linked-list { display: flex; flex-direction: column; gap: 0; }
.amenity-linked-item {
  border: 1px solid #E5E7EB;
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: all .2s;
}
.amenity-linked-item.active { border-color: #4361EE; background: #F8FAFF; }
.amenity-linked-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
}
.amenity-linked-header:hover { background: #F9FAFB; }
.amenity-linked-header input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: #4361EE;
  cursor: pointer;
}
.amenity-linked-label {
  font-size: 13px;
  font-weight: 500;
  color: #374151;
  flex: 1;
}
.amenity-linked-body {
  display: none;
  padding: 0 14px 12px 40px;
  border-top: 1px dashed #E5E7EB;
  padding-top: 10px;
  margin-top: 0;
}
.amenity-linked-item.active .amenity-linked-body { display: block; }
.amenity-checkbox-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px dashed #E5E7EB;
}
.amenity-checkbox-row label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.amenity-checkbox-row label:hover { background: #F3F4F6; }
.amenity-checkbox-row input[type="checkbox"] {
  accent-color: #4361EE;
}


/* ── V6: Module Sidebar & Drag & Drop ── */
.modules-sidebar {
  width: 200px;
  background: #fff;
  border-right: 1px solid #E5E7EB;
  padding: 16px 12px;
  overflow-y: auto;
  flex-shrink: 0;
}
.modules-sidebar h4 {
  font-size: 12px;
  font-weight: 600;
  color: #6B7280;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
  padding: 0 4px;
}
.module-list { display: flex; flex-direction: column; gap: 6px; }
.module-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 8px;
  cursor: grab;
  user-select: none;
  transition: all .15s;
  position: relative;
}
.module-item:active { cursor: grabbing; }
.module-item.dragging { opacity: 0.5; }
.module-item.drag-over { border-color: #4361EE; background: #EEF2FF; }
.module-item.active {
  background: #EEF2FF;
  border-color: #4361EE;
  color: #4361EE;
}
.module-item.hidden-module { opacity: 0.5; }
.module-item.hidden-module .module-name { text-decoration: line-through; }
.module-drag { font-size: 14px; color: #9CA3AF; cursor: grab; }
.module-icon { font-size: 16px; }
.module-name { font-size: 13px; font-weight: 500; flex: 1; }
.module-toggle { flex-shrink: 0; }
.module-toggle .switch { width: 32px; height: 18px; }
.module-toggle .switch-slider::before { width: 14px; height: 14px; left: 2px; bottom: 2px; }
.module-toggle .switch input:checked + .switch-slider::before { transform: translateX(14px); }

.module-sub-items {
  margin-left: 16px;
  margin-top: 4px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.module-sub-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: #fff;
  border: 1px solid #F3F4F6;
  border-radius: 6px;
  font-size: 12px;
  cursor: grab;
}
.module-sub-item .module-name { font-size: 12px; color: #6B7280; }

/* ── V6: Module Panels ── */
.module-panel { display: none; }
.module-panel.active { display: block; }

/* ── V6: Field Visibility Toggle ── */
.fr-visible {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.fr-visible label { margin-bottom: 0; }
.fr-visible .switch { width: 30px; height: 16px; }
.fr-visible .switch-slider::before { width: 12px; height: 12px; left: 2px; bottom: 2px; }
.fr-visible .switch input:checked + .switch-slider::before { transform: translateX(14px); }

/* ── V6: City Select ── */
.city-select-wrap { position: relative; }
.city-select-wrap select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #D1D5DB;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  color: #1D1D1F;
  background: #fff;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  padding-right: 36px;
}
.city-select-wrap select:focus {
  outline: none;
  border-color: #4361EE;
  box-shadow: 0 0 0 3px rgba(67,97,238,.1);
}
.city-select-wrap::after {
  content: '▾';
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #6B7280;
  pointer-events: none;
  font-size: 14px;
}
.city-custom-input { margin-top: 6px; }

/* ── V6: Community Activities ── */
.community-activity-card {
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 10px;
  position: relative;
}
.community-activity-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.community-activity-header .fr { flex: 1; margin-bottom: 0; }
.community-activity-del {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  background: #FFF1F2; color: #E63946;
  border: 1px solid #FECDD3;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
}
.community-activity-del:hover { background: #FFE4E6; }

.activity-images-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.activity-image-slot {
  width: 80px;
  height: 60px;
  border: 1px dashed #D1D5DB;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: #fff;
  font-size: 20px;
  color: #9CA3AF;
  position: relative;
  overflow: hidden;
}
.activity-image-slot:hover { border-color: #4361EE; color: #4361EE; }
.activity-image-slot img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.activity-image-slot .remove-img {
  position: absolute;
  top: 2px; right: 2px;
  width: 18px; height: 18px;
  background: rgba(230,57,70,.9);
  color: #fff;
  border-radius: 50%;
  font-size: 12px;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.activity-image-slot:hover .remove-img { display: flex; }

/* ── V6: Module Section Header ── */
.module-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid #F3F4F6;
}
.module-section-header h3 { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
.module-section-header .switch { width: 40px; height: 22px; }
.module-section-header .switch-slider::before { width: 16px; height: 16px; left: 3px; bottom: 3px; }
.module-section-header .switch input:checked + .switch-slider::before { transform: translateX(18px); }

/* ── V6: Sub-module Tabs ── */
.sub-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 14px;
  background: #F3F4F6;
  padding: 3px;
  border-radius: 8px;
}
.sub-tab-btn {
  flex: 1;
  padding: 7px 10px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  background: transparent;
  color: #6B7280;
  transition: all .15s;
}
.sub-tab-btn.on { background: #fff; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.sub-tab-btn:hover:not(.on) { background: rgba(255,255,255,.5); }

.sub-panel { display: none; }
.sub-panel.on { display: block; }

/* ── Layout adjustment for sidebar ── */
.shell {
  display: flex;
  height: calc(100vh - 53px);
}
.col-edit {
  width: auto;
  flex: 1;
  min-width: 380px;
  overflow-y: auto;
  padding: 20px;
  background: #F8F9FA;
}

</style>

/* ================================================================

   ================================================================ */
function renderModuleList(){
  var list = document.getElementById('moduleList');
  if(!list) return;
  var order = storeData.moduleOrder || MODULES.map(function(m){return m.id;});
  var vis = storeData.moduleVisibility || {};
  
  var html = '';
  for(var i=0; i<order.length; i++){
    var modId = order[i];
    var mod = getModuleById(modId);
    if(!mod) continue;
    var isVisible = vis[modId] !== false;
    var isActive = currentModule === modId;
    
    html += '<div class="module-item '+(isActive?'active':'')+' '+(isVisible?'':'hidden-module')+'" ';
    html += 'data-module="'+modId+'" draggable="true">';
    html += '<span class="module-drag">⋮⋮</span>';
    html += '<span class="module-icon">'+mod.icon+'</span>';
    html += '<span class="module-name">'+mod.name+'</span>';
    html += '<span class="module-toggle">';
    html += '<label class="switch">';
    html += '<input type="checkbox" class="module-vis-toggle" data-module="'+modId+'" '+(isVisible?'checked':'')+'>';
    html += '<span class="switch-slider"></span>';
    html += '</label>';
    html += '</span>';
    html += '</div>';
    
    // Sub-modules for units-amenities
    if(mod.hasSub && mod.subModules){
      html += '<div class="module-sub-items">';
      for(var j=0; j<mod.subModules.length; j++){
        var sub = mod.subModules[j];
        var subVis = vis[sub.id] !== false;
        html += '<div class="module-sub-item '+(subVis?'':'hidden-module')+'" data-module="'+sub.id+'" draggable="true">';
        html += '<span class="module-icon" style="font-size:12px">'+sub.icon+'</span>';
        html += '<span class="module-name">'+sub.name+'</span>';
        html += '<span class="module-toggle">';
        html += '<label class="switch">';
        html += '<input type="checkbox" class="module-vis-toggle" data-module="'+sub.id+'" '+(subVis?'checked':'')+'>';
        html += '<span class="switch-slider"></span>';
        html += '</label>';
        html += '</span>';
        html += '</div>';
      }
      html += '</div>';
    }
  }
  list.innerHTML = html;
  initModuleDrag();
  initModuleClicks();
  initModuleVisibilityToggles();
}

function getModuleById(id){
  for(var i=0; i<MODULES.length; i++){
    if(MODULES[i].id === id) return MODULES[i];
    if(MODULES[i].subModules){
      for(var j=0; j<MODULES[i].subModules.length; j++){
        if(MODULES[i].subModules[j].id === id) return MODULES[i].subModules[j];
      }
    }
  }
  return null;
}

/* ── Drag & Drop for Modules ── */
var dragSrc = null;
function initModuleDrag(){
  var items = document.querySelectorAll('.module-list .module-item');
  for(var i=0; i<items.length; i++){
    items[i].addEventListener('dragstart', handleDragStart);
    items[i].addEventListener('dragend', handleDragEnd);
    items[i].addEventListener('dragover', handleDragOver);
    items[i].addEventListener('drop', handleDrop);
    items[i].addEventListener('dragleave', handleDragLeave);
  }
}

function handleDragStart(e){
  dragSrc = this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', this.dataset.module);
}
function handleDragEnd(e){
  this.classList.remove('dragging');
  var items = document.querySelectorAll('.module-list .module-item');
  for(var i=0; i<items.length; i++) items[i].classList.remove('drag-over');
}
function handleDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  this.classList.add('drag-over');
}
function handleDragLeave(e){
  this.classList.remove('drag-over');
}
function handleDrop(e){
  e.preventDefault();
  this.classList.remove('drag-over');
  if(dragSrc === this) return;
  
  var srcId = dragSrc.dataset.module;
  var targetId = this.dataset.module;
  var order = storeData.moduleOrder.slice();
  
  var srcIdx = order.indexOf(srcId);
  var targetIdx = order.indexOf(targetId);
  
  if(srcIdx >= 0 && targetIdx >= 0){
    order.splice(srcIdx, 1);
    order.splice(targetIdx, 0, srcId);
    storeData.moduleOrder = order;
    renderModuleList();
    renderAllModulePanels();
    save();
    refreshPreview();
  }
}

/* ── Module Click Navigation ── */
function initModuleClicks(){
  var items = document.querySelectorAll('.module-list .module-item, .module-list .module-sub-item');
  for(var i=0; i<items.length; i++){
    items[i].addEventListener('click', function(e){
      if(e.target.closest('.switch')) return; // 点击开关不切换模块
      var modId = this.dataset.module;
      switchModule(modId);
    });
  }
}

function switchModule(modId){
  currentModule = modId;
  // 更新侧边栏高亮
  var items = document.querySelectorAll('.module-list .module-item, .module-list .module-sub-item');
  for(var i=0; i<items.length; i++){
    items[i].classList.remove('active');
    if(items[i].dataset.module === modId) items[i].classList.add('active');
  }
  // 切换面板
  var panels = document.querySelectorAll('.module-panel');
  for(var j=0; j<panels.length; j++){
    panels[j].classList.remove('active');
  }
  var targetPanel = document.getElementById('panel-'+modId);
  if(targetPanel) targetPanel.classList.add('active');
}

/* ── Module Visibility Toggles ── */
function initModuleVisibilityToggles(){
  var toggles = document.querySelectorAll('.module-vis-toggle');
  for(var i=0; i<toggles.length; i++){
    toggles[i].addEventListener('change', function(e){
      var modId = this.dataset.module;
      storeData.moduleVisibility[modId] = this.checked;
      // 更新样式
      var item = this.closest('.module-item, .module-sub-item');
      if(item){
        if(this.checked) item.classList.remove('hidden-module');
        else item.classList.add('hidden-module');
      }
      save();
      refreshPreview();
      e.stopPropagation();
    });
  }
}

/* ================================================================
   DATA COLLECTION (getData)
   ================================================================ */
function getData(){
  var d = JSON.parse(JSON.stringify(storeData)); // deep copy base
  
  // Basic fields
  var basicFields = ['brandName','brandSlogan','projectName','tagline','description',
    'totalRooms','unitRange','buildings','priceRange',
    'address','subway','surrounding','phone','wechat','manager'];
  for(var i=0; i<basicFields.length; i++){
    var el = document.getElementById('f_'+basicFields[i]);
    if(el) d[basicFields[i]] = el.value;
  }
  
  // City - 优先用自定义输入
  var cityCustom = document.getElementById('f_cityCustom');
  var citySelect = document.getElementById('f_city');
  if(cityCustom && cityCustom.value && citySelect && citySelect.value === '__custom__'){
    d.city = cityCustom.value;
  } else if(citySelect){
    d.city = citySelect.value;
  }
  
  // Images
  d.brandLogo = imageStore.brandLogo || '';
  d.heroImage = imageStore.heroImage || '';
  d.media = d.media || {};
  d.media.brandLogo = d.brandLogo;
  d.media.heroImage = d.heroImage;
  d.media.map = imageStore.map || '';
  d.media.qrcode = imageStore.qrcode || '';
  
  // Amenity images
  for(var ai=0; ai<AMENITY_PRESETS.length; ai++){
    var akey = AMENITY_PRESETS[ai].key;
    d.media[akey] = imageStore[akey] || '';
  }
  
  // Units
  var unitInputs = document.querySelectorAll('.unit-in');
  d.units = [];
  for(var ui=0; ui<unitInputs.length; ui++){
    var idx = parseInt(unitInputs[ui].dataset.idx, 10);
    var field = unitInputs[ui].dataset.field;
    if(!d.units[idx]) d.units[idx] = {name:'', area:'', price:'', desc:''};
    d.units[idx][field] = unitInputs[ui].value;
  }
  // Remove empty slots
  d.units = d.units.filter(function(u){ return u && u.name; });
  // Unit images
  var unitCount = d.units.length;
  for(var uj=0; uj<unitCount; uj++){
    var ukey = 'unit_'+uj;
    d.media[ukey] = imageStore[ukey] || '';
  }
  
  // Amenities (从checkbox收集)
  d.amenities = [];
  var amChecks = document.querySelectorAll('#amenityCardGrid input[type="checkbox"]:checked');
  for(var ci=0; ci<amChecks.length; ci++){
    d.amenities.push(amChecks[ci].value);
  }
  
  // Custom amenities
  d.customAmenities = [];
  var customCards = document.querySelectorAll('.amenity-card[data-custom="1"]');
  for(var cj=0; cj<customCards.length; cj++){
    var cnameEl = customCards[cj].querySelector('.amenity-card-name');
    if(cnameEl){
      d.customAmenities.push(cnameEl.textContent);
    }
    var ckey = customCards[cj].dataset.key;
    if(ckey) d.media[ckey] = imageStore[ckey] || '';
  }
  
  // Social media
  d.socialMedias = [];
  var socialCards = document.querySelectorAll('#socialMediaContainer .social-card');
  for(var si=0; si<socialCards.length; si++){
    var platEl = socialCards[si].querySelector('.sm-platform');
    var idEl = socialCards[si].querySelector('.sm-id');
    var smKey = 'social_'+si;
    d.socialMedias.push({
      platform: platEl ? platEl.value : '',
      id: idEl ? idEl.value : '',
      qrImage: imageStore[smKey] || ''
    });
  }
  // 兼容旧字段
  if(d.socialMedias.length > 0){
    d.xiaohongshu = d.socialMedias[0].id || '';
    d.media.xiaohongshu = d.socialMedias[0].qrImage || '';
  }
  if(d.socialMedias.length > 1){
    d.gongzhonghao = d.socialMedias[1].id || '';
    d.media.gongzhonghao = d.socialMedias[1].qrImage || '';
  }
  
  // Pricing
  d.pricing = {
    water: getVal('f_pricing_water'),
    electricity: getVal('f_pricing_electricity'),
    network: getVal('f_pricing_network'),
    service: getVal('f_pricing_service'),
    payment: [],
    leaseTerm: getVal('f_pricing_leaseTerm'),
    deposit: getVal('f_pricing_deposit'),
    remark: getVal('f_pricing_remark')
  };
  var payChecks = document.querySelectorAll('#paymentChecks input:checked');
  for(var pi=0; pi<payChecks.length; pi++){
    d.pricing.payment.push(payChecks[pi].value);
  }
  d.enablePricing = d.moduleVisibility && d.moduleVisibility.pricing;
  
  // Community activities
  d.communityActivities = [];
  var actCards = document.querySelectorAll('.community-activity-card');
  for(var ai=0; ai<actCards.length; ai++){
    var idx = parseInt(actCards[ai].dataset.idx, 10);
    var nameEl = actCards[ai].querySelector('.activity-name');
    var actName = nameEl ? nameEl.value : '';
    var images = [];
    for(var j=0; j<3; j++){
      var imgKey = 'activity_'+idx+'_'+j;
      images.push(imageStore[imgKey] || '');
    }
    d.communityActivities.push({name: actName, images: images});
  }
  
  return d;
}

/* ================================================================
   FORM FILLING (fillForm)
   ================================================================ */
function fillForm(d){
  storeData = JSON.parse(JSON.stringify(d));
  // 确保必要字段存在
  if(!storeData.moduleOrder) storeData.moduleOrder = ['basic','units-amenities','contact','pricing','community'];
  if(!storeData.moduleVisibility) storeData.moduleVisibility = {
    basic:true, units:true, amenities:true, contact:true, pricing:false, community:true
  };
  if(!storeData.fieldVisibility) storeData.fieldVisibility = {};
  if(!storeData.units) storeData.units = [];
  if(!storeData.amenities) storeData.amenities = [];
  if(!storeData.customAmenities) storeData.customAmenities = [];
  if(!storeData.socialMedias) storeData.socialMedias = [];
  if(!storeData.communityActivities) storeData.communityActivities = [];
  if(!storeData.media) storeData.media = {};
  if(!storeData.pricing) storeData.pricing = {payment:[]};
  
  // 加载图片到imageStore（必须在渲染面板之前完成）
  initImageStore();
  var media = d.media || {};
  for(var mk in media){
    if(media.hasOwnProperty(mk)){
      imageStore[mk] = media[mk] || '';
    }
  }
  if(d.brandLogo) imageStore.brandLogo = d.brandLogo;
  if(d.heroImage) imageStore.heroImage = d.heroImage;
  
  // 加载社交媒体图片
  if(d.socialMedias){
    for(var si=0; si<d.socialMedias.length; si++){
      var skey = 'social_'+si;
      if(d.socialMedias[si].qrImage) imageStore[skey] = d.socialMedias[si].qrImage;
    }
  }
  
  // 加载活动图片
  if(d.communityActivities){
    for(var ai=0; ai<d.communityActivities.length; ai++){
      var act = d.communityActivities[ai];
      if(act.images){
        for(var j=0; j<act.images.length; j++){
          var akey = 'activity_'+ai+'_'+j;
          imageStore[akey] = act.images[j] || '';
        }
      }
    }
  }
  
  // 渲染所有面板（此时 storeData 和 imageStore 已就绪）
  renderAllModulePanels();
  renderModuleList();
  
  // 显式填充基础信息字段（确保DOM中input值正确）
  var basicFields = ['brandName','brandSlogan','projectName','tagline','description',
    'totalRooms','unitRange','buildings','priceRange',
    'address','subway','surrounding','phone','wechat','manager'];
  for(var bi=0; bi<basicFields.length; bi++){
    setVal('f_'+basicFields[bi], storeData[basicFields[bi]] || '');
  }
  // 城市选择
  if(storeData.city){
    var citySel = document.getElementById('f_city');
    if(citySel){
      var found = false;
      for(var ci=0; ci<citySel.options.length; ci++){
        if(citySel.options[ci].value === storeData.city){ citySel.value = storeData.city; found=true; break; }
      }
      if(!found){ citySel.value = '__custom__'; setVal('f_cityCustom', storeData.city); }
    }
  }
  
  // 加载图片预览
  var previewKeys = ['brandLogo','heroImage','map','qrcode'];
  for(var pk=0; pk<previewKeys.length; pk++){
    loadImagePreview(previewKeys[pk], imageStore[previewKeys[pk]] || '');
  }
  for(var ai2=0; ai2<AMENITY_PRESETS.length; ai2++){
    loadImagePreview(AMENITY_PRESETS[ai2].key, imageStore[AMENITY_PRESETS[ai2].key] || '');
  }
  
  // 渲染户型列表和配套卡片（只调一次，面板内init不再重复调用）
  renderUnits(storeData.units || []);
  renderAmenityCards(storeData.amenities || [], storeData.customAmenities || [], storeData.media || {});
  
  // 恢复社群活动名称输入值
  if(storeData.communityActivities){
    for(var ca=0; ca<storeData.communityActivities.length; ca++){
      var nameInput = document.querySelector('.activity-name[data-idx="'+ca+'"]');
      if(nameInput) nameInput.value = storeData.communityActivities[ca].name || '';
    }
  }
  
  // 填充pricing
  var p = storeData.pricing || {};
  setVal('f_pricing_water', p.water || '');
  setVal('f_pricing_electricity', p.electricity || '');
  setVal('f_pricing_network', p.network || '');
  setVal('f_pricing_service', p.service || '');
  setVal('f_pricing_leaseTerm', p.leaseTerm || '');
  setVal('f_pricing_deposit', p.deposit || '');
  setVal('f_pricing_remark', p.remark || '');
  var pays = p.payment || [];
  var payChecks = document.querySelectorAll('#paymentChecks input[type="checkbox"]');
  for(var pi=0; pi<payChecks.length; pi++){
    payChecks[pi].checked = pays.indexOf(payChecks[pi].value) >= 0;
  }
}

/* ================================================================
   UNITS RENDERING (户型渲染)
   ================================================================ */
function renderUnits(units){
  var box = document.getElementById('unitList');
  if(!box) return;
  box.innerHTML = '';
  var fields = [{k:'name',l:'名称'},{k:'area',l:'面积'},{k:'price',l:'价格'},{k:'desc',l:'描述'}];
  for(var i=0;i<units.length;i++){
    var html='<div style="background:#F9FAFB;border-radius:8px;padding:12px;margin-bottom:8px;position:relative">';
    html+='<button type="button" class="unit-del" data-idx="'+i+'" style="position:absolute;top:8px;right:8px;background:none;border:none;color:#E63946;cursor:pointer;font-size:16px" title="删除">×</button>';
    html+='<div class="fg">';
    for(var j=0;j<fields.length;j++){
      var v = (units[i] && units[i][fields[j].k]) ? units[i][fields[j].k] : '';
      html+='<div class="fr"><label>'+fields[j].l+'</label><input type="text" class="unit-in" data-idx="'+i+'" data-field="'+fields[j].k+'" value="'+escAttr(v)+'"></div>';
    }
    html+='</div>';
    var ukey = 'unit_'+i;
    var uname = (units[i] && units[i].name) ? units[i].name : '户型';
    var uimg = imageStore[ukey] || '';
    html+='<div class="unit-image-row">';
    html+='<img id="thumb_'+ukey+'" class="unit-image-thumb" '+(uimg?'src="'+escAttr(uimg)+'"':'style="display:none"')+' alt="'+escAttr(uname)+'的户型图">';
    html+='<div class="unit-image-controls">';
    html+='<div class="unit-image-label">'+escAttr(uname)+'的户型图（4:3）</div>';
    html+='<button type="button" class="unit-img-btn" data-key="'+ukey+'" data-aspect="4:3">📁 选择图片</button>';
    html+='<button type="button" class="unit-img-remove" data-key="'+ukey+'" '+(uimg?'':'style="display:none"')+'>✕ 移除</button>';
    html+='</div></div>';
    html+='</div>';
    box.insertAdjacentHTML('beforeend', html);
  }
}

/* ================================================================
   AMENITY CARDS (配套卡片渲染)
   ================================================================ */
function renderAmenityCards(checkedAmenities, customNames, mediaData){
  var grid = document.getElementById('amenityCardGrid');
  if(!grid) return;
  var html = '';
  for(var i=0; i<AMENITY_PRESETS.length; i++){
    var p = AMENITY_PRESETS[i];
    var isChecked = checkedAmenities.indexOf(p.name) >= 0;
    html += buildAmenityCard(p.key, p.name, p.emoji, isChecked, false, mediaData);
  }
  for(var ci=0; ci<customNames.length; ci++){
    var cname = customNames[ci];
    var ckey = 'custom_' + ci;
    var cchecked = checkedAmenities.indexOf('custom:' + cname) >= 0 || checkedAmenities.indexOf(cname) >= 0;
    html += buildAmenityCard(ckey, cname, '⭐', cchecked, true, mediaData);
  }
  grid.innerHTML = html;
}

function buildAmenityCard(key, name, emoji, checked, isCustom, mediaData){
  var val = isCustom ? 'custom:' + name : name;
  var imgData = (mediaData && mediaData[key]) ? mediaData[key] : (imageStore[key] || '');
  var h = '<div class="amenity-card '+(checked?'active':'')+'" data-key="'+key+'"'+(isCustom?' data-custom="1"':'')+'>';
  h += '<div class="amenity-card-header">';
  h += '<input type="checkbox" value="'+escAttr(val)+'" '+(checked?'checked':'')+'>';
  h += '<span class="amenity-card-emoji">'+emoji+'</span>';
  h += '<span class="amenity-card-name">'+name+'</span>';
  if(isCustom){
    h += '<button type="button" class="amenity-card-del" data-del-key="'+key+'" title="删除">×</button>';
  }
  h += '</div>';
  h += '<div class="amenity-card-body">';
  h += '<div class="upload-field">';
  h += '<img id="thumb_'+key+'" class="upload-thumb" '+(imgData?'src="'+escAttr(imgData)+'"':'style="display:none"')+' alt="'+name+'">';
  h += '<div class="upload-controls">';
  h += '<button type="button" class="upload-btn" data-key="'+key+'" data-aspect="4:3">📁 选择图片</button>';
  h += '<button type="button" class="upload-remove" data-key="'+key+'" '+(imgData?'':'style="display:none"')+'>✕ 移除</button>';
  h += '<div class="upload-hint">建议 4:3 横版</div>';
  h += '</div></div></div></div>';
  return h;
}

function initAmenityCards(){
  var grid = document.getElementById('amenityCardGrid');
  if(!grid) return;
  grid.addEventListener('change', function(e){
    if(e.target.type === 'checkbox'){
      var card = e.target.closest('.amenity-card');
      if(!card) return;
      if(e.target.checked) card.classList.add('active');
      else card.classList.remove('active');
      save();
      refreshPreview();
    }
  });
  grid.addEventListener('click', function(e){
    if(e.target.classList.contains('amenity-card-del')){
      var dkey = e.target.dataset.delKey;
      var card = e.target.closest('.amenity-card');
      if(card){
        card.remove();
        if(imageStore[dkey] !== undefined) delete imageStore[dkey];
        save();
        refreshPreview();
      }
    }
  });
  var addBtn = document.getElementById('btnAddCustomAmenity');
  if(addBtn){
    addBtn.addEventListener('click', function(){
      var input = document.getElementById('customAmenityInput');
      var name = input ? input.value.trim() : '';
      if(!name){ toast('请输入配套名称'); return; }
      var existing = document.querySelectorAll('.amenity-card .amenity-card-name');
      for(var i=0;i<existing.length;i++){
        if(existing[i].textContent === name){ toast('该配套已存在'); return; }
      }
      var customCards = document.querySelectorAll('.amenity-card[data-custom="1"]');
      var nextIdx = customCards.length;
      var ckey = 'custom_' + nextIdx;
      imageStore[ckey] = '';
      var grid = document.getElementById('amenityCardGrid');
      var newCard = buildAmenityCard(ckey, name, '⭐', true, true, {});
      grid.insertAdjacentHTML('beforeend', newCard);
      input.value = '';
      save();
      refreshPreview();
    });
  }
}

/* ================================================================
   IMAGE UPLOAD (图片上传)
   ================================================================ */
function initImageUploads(){
  document.addEventListener('click', function(e){
    // 上传按钮
    var uploadBtn = e.target.closest('.upload-btn, .unit-img-btn');
    if(uploadBtn){
      var key = uploadBtn.dataset.key;
      var aspect = uploadBtn.dataset.aspect || '4:3';
      var inp = document.createElement('input');
      inp.type='file'; inp.accept='image/jpeg,image/png,image/webp';
      inp.onchange = function(ev){
        var file = ev.target.files[0];
        if(!file) return;
        compressImage(file, 1200, 1200, 0.82, function(dataUrl){
          imageStore[key] = dataUrl;
          // 同步更新storeData.media
          if(!storeData.media) storeData.media = {};
          storeData.media[key] = dataUrl;
          loadImagePreview(key, dataUrl);
          // 如果是配套图片，重新渲染配套卡片
          var isAmenity = false;
          for(var ai=0; ai<AMENITY_PRESETS.length; ai++){
            if(AMENITY_PRESETS[ai].key === key){ isAmenity = true; break; }
          }
          if(isAmenity){
            renderAmenityCards(storeData.amenities || [], storeData.customAmenities || [], storeData.media);
          }
          // 如果是户型图片，重新渲染户型列表
          if(key.indexOf('unit_') === 0){
            storeData.media[key] = dataUrl;
            renderUnits(storeData.units || []);
          }
          // 同步更新活动数据
          if(key.indexOf('activity_') === 0){
            var parts = key.split('_');
            var actIdx = parseInt(parts[1], 10);
            var imgIdx = parseInt(parts[2], 10);
            if(storeData.communityActivities && storeData.communityActivities[actIdx]){
              if(!storeData.communityActivities[actIdx].images) 
                storeData.communityActivities[actIdx].images = [];
              storeData.communityActivities[actIdx].images[imgIdx] = dataUrl;
              renderCommunityActivities();
            }
          }
          // 同步更新社交媒体数据
          if(key.indexOf('social_') === 0){
            var sIdx = parseInt(key.substring(7), 10);
            if(storeData.socialMedias && storeData.socialMedias[sIdx]){
              storeData.socialMedias[sIdx].qrImage = dataUrl;
            }
          }
          save();
          refreshPreview();
          toast('✅ 图片已上传');
        });
      };
      inp.click();
      return;
    }
    // 移除按钮
    var removeBtn = e.target.closest('.upload-remove, .unit-img-remove');
    if(removeBtn){
      var key2 = removeBtn.dataset.key;
      imageStore[key2] = '';
      loadImagePreview(key2, '');
      // 同步活动数据
      if(key2.indexOf('activity_') === 0){
        var parts2 = key2.split('_');
        var actIdx2 = parseInt(parts2[1], 10);
        var imgIdx2 = parseInt(parts2[2], 10);
        if(storeData.communityActivities && storeData.communityActivities[actIdx2]){
          if(storeData.communityActivities[actIdx2].images){
            storeData.communityActivities[actIdx2].images[imgIdx2] = '';
          }
          renderCommunityActivities();
        }
      }
      // 同步社交媒体数据
      if(key2.indexOf('social_') === 0){
        var sIdx2 = parseInt(key2.substring(7), 10);
        if(storeData.socialMedias && storeData.socialMedias[sIdx2]){
          storeData.socialMedias[sIdx2].qrImage = '';
        }
      }
      save();
      refreshPreview();
      toast('已移除');
    }
    // 活动图片槽点击
    var imgSlot = e.target.closest('.activity-image-slot');
    if(imgSlot && !e.target.closest('.remove-img')){
      var akey = imgSlot.dataset.key;
      var actIdx = parseInt(imgSlot.dataset.actIdx, 10);
      var imgIdx = parseInt(imgSlot.dataset.imgIdx, 10);
      var inp2 = document.createElement('input');
      inp2.type='file'; inp2.accept='image/jpeg,image/png,image/webp';
      inp2.onchange = function(ev){
        var file = ev.target.files[0];
        if(!file) return;
        compressImage(file, 1200, 900, 0.82, function(dataUrl){
          imageStore[akey] = dataUrl;
          if(storeData.communityActivities && storeData.communityActivities[actIdx]){
            if(!storeData.communityActivities[actIdx].images)
              storeData.communityActivities[actIdx].images = [];
            storeData.communityActivities[actIdx].images[imgIdx] = dataUrl;
          }
          renderCommunityActivities();
          save();
          refreshPreview();
          toast('✅ 图片已上传');
        });
      };
      inp2.click();
      return;
    }
    // 活动图片删除
    if(e.target.classList.contains('remove-img')){
      var rkey = e.target.dataset.key;
      var ractIdx = parseInt(e.target.dataset.actIdx, 10);
      var rimgIdx = parseInt(e.target.dataset.imgIdx, 10);
      imageStore[rkey] = '';
      if(storeData.communityActivities && storeData.communityActivities[ractIdx]){
        if(storeData.communityActivities[ractIdx].images){
          storeData.communityActivities[ractIdx].images[rimgIdx] = '';
        }
      }
      renderCommunityActivities();
      save();
      refreshPreview();
      toast('已移除');
    }
  });
}

function compressImage(file, maxW, maxH, quality, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var w=img.width, h=img.height;
      var ratio = Math.min(maxW/w, maxH/h, 1);
      w=Math.round(w*ratio); h=Math.round(h*ratio);
      var canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ toast('❌ 图片读取失败'); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ toast('❌ 文件读取失败'); };
  reader.readAsDataURL(file);
}

function loadImagePreview(key, dataUrl){
  var thumb = document.getElementById('thumb_'+key);
  var removeBtn = document.querySelector('.upload-remove[data-key="'+key+'"]');
  var unitRemoveBtn = document.querySelector('.unit-img-remove[data-key="'+key+'"]');
  if(thumb){
    if(dataUrl){
      thumb.src = dataUrl;
      thumb.style.display = 'block';
      if(removeBtn) removeBtn.style.display = '';
      if(unitRemoveBtn) unitRemoveBtn.style.display = '';
    } else {
      thumb.src = '';
      thumb.style.display = 'none';
      if(removeBtn) removeBtn.style.display = 'none';
      if(unitRemoveBtn) unitRemoveBtn.style.display = 'none';
    }
  }
}

/* ================================================================
   SAVE / LOAD
   ================================================================ */
function save(){
  try{
    var d = getData();
    localStorage.setItem(SKEY, JSON.stringify(d));
  }catch(e){
    if(e.name==='QuotaExceededError') toast('⚠️ 存储空间不足，建议导出JSON后清理缓存');
  }
}
function load(){
  try{
    var s=localStorage.getItem(SKEY);
    if(s) return JSON.parse(s);
  }catch(e){}
  return null;
}

/* ================================================================
   PREVIEW
   ================================================================ */
function refreshPreview(){
  save();
  var tpl = TEMPLATES[curStyle] || TEMPLATES['warm-editorial'];
  var data = getData();
  var dataScript = '<scr'+'ipt>window.__STORE_DATA__='+JSON.stringify(data)+';<\/scr'+'ipt>';
  var fullHtml = tpl.replace(/<\/head>/i, dataScript + '\n</head>');
  var f = document.getElementById('previewFrame');
  f.srcdoc = '<meta charset="UTF-8">' + fullHtml;
}

/* ================================================================
   EXPORT
   ================================================================ */
function exportHTML(){
  save();
  var tpl = TEMPLATES[curStyle] || TEMPLATES['warm-editorial'];
  var data = getData();
  var dataScript = '<scr'+'ipt>window.__STORE_DATA__='+JSON.stringify(data)+';<\/scr'+'ipt>';
  var fullHtml = tpl.replace(/<\/head>/i, dataScript + '\n</head>');
  var fname = data.brandName + '-' + data.projectName + '-' + curStyle + '.html';
  var blob = new Blob([fullHtml],{type:'text/html;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('✅ 已导出: ' + fname);
}

function exportJSON(){
  save();
  var data = getData();
  var blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = data.brandName + '-' + data.projectName + '-data.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('✅ 数据已导出');
}

function exportPDF(){
  save();
  var tpl = TEMPLATES[curStyle] || TEMPLATES['warm-editorial'];
  var data = getData();
  var dataScript = '<scr'+'ipt>window.__STORE_DATA__='+JSON.stringify(data)+';<\/scr'+'ipt>';
  var fullHtml = tpl.replace(/<\/head>/i, dataScript + '\n</head>');
  var printStyles = '<style>@media print{@page{size:A4;margin:12mm}body{margin:0}html,body{width:100%}}</style>';
  fullHtml = fullHtml.replace(/<\/head>/i, printStyles + '\n</head>');
  var w = window.open('', '_blank');
  if(!w){ toast('❌ 请允许弹窗以导出PDF'); return; }
  w.document.open();
  w.document.write(fullHtml);
  w.document.close();
  w.addEventListener('load', function(){
    setTimeout(function(){ w.focus(); w.print(); }, 800);
  });
  setTimeout(function tryPrint(){
    if(w.document.readyState === 'complete'){
      setTimeout(function(){ w.focus(); w.print(); }, 500);
    } else {
      setTimeout(tryPrint, 200);
    }
  }, 300);
  toast('📄 正在生成PDF，请在打印对话框中选择"另存为PDF"');
}

function copyShareLink(){
  save();
  var tpl = TEMPLATES[curStyle] || TEMPLATES['warm-editorial'];
  var data = getData();
  var dataScript = '<scr'+'ipt>window.__STORE_DATA__='+JSON.stringify(data)+';<\/scr'+'ipt>';
  var fullHtml = tpl.replace(/<\/head>/i, dataScript + '\n<\/head>');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(fullHtml).then(function(){
      toast('✅ 展示页HTML已复制到剪贴板');
    }).catch(function(){ fallbackCopy(fullHtml); });
  } else { fallbackCopy(fullHtml); }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); toast('✅ 展示页HTML已复制到剪贴板'); }
  catch(e){ toast('❌ 复制失败，请手动导出HTML'); }
  document.body.removeChild(ta);
}

/* ================================================================
   GLOBAL STORE DATA (全局状态)
   ================================================================ */
var storeData = {};

/* ================================================================
   INIT
   ================================================================ */
function init(){
  // 初始化默认数据
  storeData = JSON.parse(JSON.stringify(DEFAULTS));
  
  // 加载保存的数据
  var saved = load();
  if(saved && saved.brandName){
    fillForm(saved);
  } else {
    fillForm(DEFAULTS);
    save();
  }
  
  // 渲染模块列表和面板（必须先于后续初始化）
  renderModuleList();
  renderAllModulePanels();
  // 初始化配套卡片交互
  initAmenityCards();
  // 初始化图片上传
  initImageUploads();
  
  // 户型增删
  var addUnitBtn = document.getElementById('btnAddUnit');
  if(addUnitBtn){
    addUnitBtn.addEventListener('click', function(){
      var d = getData();
      d.units.push({name:'',area:'',price:'',desc:''});
      var newIdx = d.units.length;
      var newKey = 'unit_'+(newIdx-1);
      imageStore[newKey] = '';
      renderUnits(d.units);
      storeData.units = d.units;
      save();
    });
  }
  var unitList = document.getElementById('unitList');
  if(unitList){
    unitList.addEventListener('click', function(e){
      if(e.target.classList.contains('unit-del')){
        var idx = parseInt(e.target.dataset.idx,10);
        var d = getData();
        d.units.splice(idx,1);
        // 重新排列图片key
        var newImageStore = {};
        for(var k in imageStore){
          if(imageStore.hasOwnProperty(k) && k.indexOf('unit_') !== 0){
            newImageStore[k] = imageStore[k];
          }
        }
        for(var ui=0; ui<d.units.length; ui++){
          var oldKey = 'unit_'+(ui < idx ? ui : ui+1);
          var newKey = 'unit_'+ui;
          newImageStore[newKey] = imageStore[oldKey] || '';
        }
        imageStore = newImageStore;
        renderUnits(d.units);
        storeData.units = d.units;
        save();
        refreshPreview();
      }
    });
  }
  
  // 样式切换
  var stBtns = document.querySelectorAll('.st-btn');
  for(var i=0;i<stBtns.length;i++){
    stBtns[i].addEventListener('click', function(){
      for(var j=0;j<stBtns.length;j++) stBtns[j].classList.remove('on');
      this.classList.add('on');
      curStyle = this.dataset.style;
      refreshPreview();
    });
  }
  
  // 自动保存
  document.addEventListener('input', function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') save();
  });
  document.addEventListener('change', function(e){
    if(e.target.type==='checkbox') save();
  });
  
  // 按钮事件
  var btnRefresh = document.getElementById('btnRefresh');
  if(btnRefresh) btnRefresh.addEventListener('click', refreshPreview);
  var btnCopyShare = document.getElementById('btnCopyShare');
  if(btnCopyShare) btnCopyShare.addEventListener('click', copyShareLink);
  var btnSample = document.getElementById('btnSample');
  if(btnSample){
    btnSample.addEventListener('click', function(){
      if(confirm('确定用示例数据覆盖当前内容？')){
        fillForm(DEFAULTS);
        save();
        refreshPreview();
        toast('✅ 示例数据已填充');
      }
    });
  }
  var btnReset = document.getElementById('btnReset');
  if(btnReset){
    btnReset.addEventListener('click', function(){
      if(confirm('确定清除所有缓存并重置为默认数据？')){
        try{ localStorage.removeItem(SKEY); }catch(e){}
        fillForm(DEFAULTS);
        save();
        refreshPreview();
        toast('✅ 已重置');
      }
    });
  }
  var btnExportHtml = document.getElementById('btnExportHtml');
  if(btnExportHtml) btnExportHtml.addEventListener('click', exportHTML);
  var btnExportJson = document.getElementById('btnExportJson');
  if(btnExportJson) btnExportJson.addEventListener('click', exportJSON);
  var btnExportPdf = document.getElementById('btnExportPdf');
  if(btnExportPdf) btnExportPdf.addEventListener('click', exportPDF);
  var btnSaveJson = document.getElementById('btnSaveJson');
  if(btnSaveJson){
    btnSaveJson.addEventListener('click', function(){
      document.getElementById('fileInput').click();
    });
  }
  var fileInput = document.getElementById('fileInput');
  if(fileInput){
    fileInput.addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        try{
          var d = JSON.parse(ev.target.result);
          fillForm(d);
          save();
          refreshPreview();
          toast('✅ 数据已加载');
        }catch(err){ toast('❌ JSON解析失败'); }
      };
      reader.readAsText(file);
      e.target.value = '';
    });
  }
  
  // 初始预览
  refreshPreview();
}

init();
})();
</script>
