<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泊寓门店展示 - 编辑器</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
  background: #F0F2F5;
  color: #1D1D1F;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Top Bar ── */
.topbar {
  background: #fff;
  border-bottom: 1px solid #E5E7EB;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar h1 { font-size: 16px; font-weight: 700; color: #111; }
.topbar-actions { display: flex; gap: 8px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
.btn-p { background: #4361EE; color: #fff; }
.btn-p:hover { background: #3A56D4; }
.btn-o { background: #fff; color: #4361EE; border: 1px solid #4361EE; }
.btn-o:hover { background: #EEF2FF; }
.btn-g { background: #E8F5E9; color: #2E7D32; }
.btn-g:hover { background: #C8E6C9; }
.btn-d { background: #FFF3E0; color: #E65100; }
.btn-d:hover { background: #FFE0B2; }

/* ── Main Layout ── */
.shell {
  display: flex;
  height: calc(100vh - 53px);
}
.col-edit {
  width: 46%;
  min-width: 380px;
  overflow-y: auto;
  padding: 20px;
  background: #F8F9FA;
}
.col-prev {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: #fff;
  border-left: 1px solid #E5E7EB;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  background: #fff;
  padding: 4px;
  border-radius: 10px;
  border: 1px solid #E5E7EB;
}
.tab-btn {
  flex: 1;
  padding: 8px 12px;
  border: none;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  background: transparent;
  color: #6B7280;
  transition: all .15s;
}
.tab-btn.on { background: #4361EE; color: #fff; }
.tab-btn:hover:not(.on) { background: #F3F4F6; }

.panel { display: none; }
.panel.on { display: block; }

/* ── Cards ── */
.card {
  background: #fff;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 12px;
}
.card h3 {
  font-size: 14px;
  font-weight: 600;
  color: #111;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid #F3F4F6;
}

/* ── Form Fields ── */
.fr { margin-bottom: 12px; }
.fr label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: #374151;
  margin-bottom: 4px;
}
.fr input[type="text"], .fr textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #D1D5DB;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  color: #1D1D1F;
  background: #fff;
  transition: border-color .15s;
}
.fr input[type="text"]:focus, .fr textarea:focus {
  outline: none;
  border-color: #4361EE;
  box-shadow: 0 0 0 3px rgba(67,97,238,.1);
}
.fr textarea { resize: vertical; min-height: 60px; }
.fg { display: flex; gap: 12px; }
.fg > .fr { flex: 1; }
.hint { font-size: 11px; color: #9CA3AF; margin-top: 4px; }

/* ── Checkbox Group ── */
.cbg { display: flex; flex-wrap: wrap; gap: 8px; }
.cbg label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}
.cbg label:hover { background: #F3F4F6; }

/* ── Image Upload ── */
.upload-field { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.upload-thumb {
  width: 80px; height: 80px;
  border-radius: 8px;
  object-fit: cover;
  border: 1px solid #E5E7EB;
  background: #F9FAFB;
  flex-shrink: 0;
}
.upload-controls { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: #4361EE;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 12.5px;
  cursor: pointer;
  font-family: inherit;
}
.upload-btn:hover { background: #3A56D4; }
.upload-remove {
  padding: 5px 10px;
  background: #fff;
  color: #E63946;
  border: 1px solid #FECDD3;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
}
.upload-remove:hover { background: #FFF1F2; }
.upload-hint { font-size: 11px; color: #9CA3AF; margin-top: 2px; }

/* ── Preview ── */
.prev-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.prev-head h3 { font-size: 14px; font-weight: 600; }
.style-row {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.st-btn {
  flex: 1;
  padding: 8px 10px;
  border: 1px solid #E5E7EB;
  border-radius: 8px;
  background: #fff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
.st-btn.on { background: #4361EE; color: #fff; border-color: #4361EE; }
.st-btn:hover:not(.on) { background: #F9FAFB; }
.prev-frame {
  width: 100%;
  height: 60vh;
  border: 1px solid #E5E7EB;
  border-radius: 12px;
  background: #F9FAFB;
}

/* ── Export ── */
.export-card { background: linear-gradient(135deg, #F8F9FA, #EEF2FF); border-color: #C7D2FE; }
.export-card h3 { color: #4361EE; border-color: #C7D2FE; }
.bg { display: flex; gap: 8px; flex-wrap: wrap; }
.info-box {
  background: #FFF9C4;
  border: 1px solid #FFE082;
  border-radius: 8px;
  padding: 12px;
  margin-top: 12px;
  font-size: 12px;
  color: #5D4037;
  line-height: 1.7;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1D1D1F;
  color: #fff;
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  z-index: 9999;
  transition: transform .3s;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 768px) {
  .shell { flex-direction: column; }
  .col-edit { width: 100%; min-width: auto; height: auto; }
  .col-prev { border-left: none; border-top: 1px solid #E5E7EB; }
  .prev-frame { height: 50vh; }
}

/* ── Unit Image Upload ── */
.unit-image-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed #E5E7EB;
}
.unit-image-thumb {
  width: 64px;
  height: 64px;
  border-radius: 6px;
  object-fit: cover;
  border: 1px solid #E5E7EB;
  background: #F9FAFB;
  flex-shrink: 0;
}
.unit-image-label {
  font-size: 12px;
  font-weight: 500;
  color: #374151;
  margin-bottom: 6px;
}
.unit-image-controls { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.unit-img-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  background: #4361EE;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
}
.unit-img-btn:hover { background: #3A56D4; }
.unit-img-remove {
  padding: 4px 8px;
  background: #fff;
  color: #E63946;
  border: 1px solid #FECDD3;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
}
.unit-img-remove:hover { background: #FFF1F2; }

/* ── Print styles for PDF export ── */
@media print {
  @page { size: A4; margin: 12mm; }
  body * { visibility: hidden; }
  .col-prev, .col-prev * { visibility: visible; }
  .col-prev {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    padding: 0 !important;
    border: none !important;
  }
  .prev-head, .style-row, .export-card, .topbar, .col-edit, .toast, .tabs, .card { display: none !important; }
  .prev-frame {
    width: 100% !important;
    height: auto !important;
    min-height: 100vh !important;
    border: none !important;
    border-radius: 0 !important;
  }
}


/* ── Linked Amenity Upload ── */
.amenity-linked-list { display: flex; flex-direction: column; gap: 0; }
.amenity-linked-item {
  border: 1px solid #E5E7EB;
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: all .2s;
}
.amenity-linked-item.active { border-color: #4361EE; background: #F8FAFF; }
.amenity-linked-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
}
.amenity-linked-header:hover { background: #F9FAFB; }
.amenity-linked-header input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: #4361EE;
  cursor: pointer;
}
.amenity-linked-label {
  font-size: 13px;
  font-weight: 500;
  color: #374151;
  flex: 1;
}
.amenity-linked-body {
  display: none;
  padding: 0 14px 12px 40px;
  border-top: 1px dashed #E5E7EB;
  padding-top: 10px;
  margin-top: 0;
}
.amenity-linked-item.active .amenity-linked-body { display: block; }
.amenity-checkbox-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px dashed #E5E7EB;
}
.amenity-checkbox-row label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: #F9FAFB;
  border: 1px solid #E5E7EB;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.amenity-checkbox-row label:hover { background: #F3F4F6; }
.amenity-checkbox-row input[type="checkbox"] {
  accent-color: #4361EE;
}

</style>
<link href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css" rel="stylesheet">
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <h1>🏠 泊寓门店展示工具</h1>
  <div class="topbar-actions">
    <button type="button" class="btn btn-o" id="btnSaveJson">📂 加载JSON</button>
    <button type="button" class="btn btn-g" id="btnCopyShare">📋 复制分享链接</button>
    <button type="button" class="btn btn-d" id="btnSample">📝 填充示例</button>
    <button type="button" class="btn btn-o" id="btnReset">🗑️ 重置</button>
  </div>
</div>

<!-- Main -->
<div class="shell">
  <!-- Left: Editor -->
  <div class="col-edit">
    <div class="tabs">
      <button type="button" class="tab-btn on" data-tab="basic">基本信息</button>
      <button type="button" class="tab-btn" data-tab="rooms">房源配套</button>
      <button type="button" class="tab-btn" data-tab="media">图片素材</button>
      <button type="button" class="tab-btn" data-tab="contact">位置联系</button>
    </div>

    <!-- TAB: 基本信息 -->
    <div class="panel on" id="p-basic">
      <div class="card">
        <h3>品牌信息</h3>
        <div class="fr"><label>品牌名称</label><input type="text" id="f_brandName" placeholder="交投泊寓"></div>
        <div class="fr"><label>品牌 Slogan</label><input type="text" id="f_brandSlogan" placeholder="城市青年社区"></div>
        <div class="fr"><label>品牌 Logo</label>
          <div class="upload-field">
            <img id="thumb_brandLogo" class="upload-thumb" style="display:none" alt="">
            <div class="upload-controls">
              <button type="button" class="upload-btn" data-key="brandLogo">📁 选择图片</button>
              <button type="button" class="crop-btn" data-action="crop">✂ 裁剪</button>
                <button type="button" class="upload-remove" data-key="brandLogo" style="display:none">✕ 移除</button>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>项目信息</h3>
        <div class="fr"><label>项目名称</label><input type="text" id="f_projectName" placeholder="花山河店"></div>
        <div class="fr"><label>所在城市</label><input type="text" id="f_city" placeholder="武汉"></div>
        <div class="fr"><label>项目标语</label><input type="text" id="f_tagline" placeholder="在城市的心脏，找到你的节奏"></div>
        <div class="fr"><label>项目简介</label><textarea id="f_description" rows="3" placeholder="一段描述项目特色和氛围的文字..."></textarea></div>
        <div class="fr"><label>主视觉图</label>
          <div class="upload-field">
            <img id="thumb_heroImage" class="upload-thumb" style="width:140px;height:80px;display:none" alt="">
            <div class="upload-controls">
              <button type="button" class="upload-btn" data-key="heroImage">📁 选择主视觉图</button>
              <button type="button" class="crop-btn" data-action="crop">✂ 裁剪</button>
                <button type="button" class="upload-remove" data-key="heroImage" style="display:none">✕ 移除</button>
              <div class="upload-hint">建议 16:9 横版</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB: 房源配套 -->
    <div class="panel" id="p-rooms">
      <div class="card">
        <h3>房源数据</h3>
        <div class="fg">
          <div class="fr"><label>总房间数</label><input type="text" id="f_totalRooms" placeholder="696"></div>
          <div class="fr"><label>户型面积</label><input type="text" id="f_unitRange" placeholder="15-37㎡"></div>
        </div>
        <div class="fr"><label>楼栋信息</label><textarea id="f_buildings" rows="2" placeholder="G10栋 · 288间&#10;G11栋 · 408间"></textarea></div>
        <div class="fr"><label>租金范围（起价）</label><input type="text" id="f_priceRange" placeholder="746元/月起"></div>
      </div>
      <div class="card">
        <h3>户型列表</h3>
        <div id="unitList"></div>
        <button type="button" class="btn btn-o" id="btnAddUnit" style="margin-top:8px;font-size:12px">+ 添加户型</button>
      </div>
      <div class="card">
        <h3>公共配套</h3>
        <div class="cbg" id="amenityChecks">
          <label><input type="checkbox" value="健身房"> 健身房</label>
          <label><input type="checkbox" value="书吧"> 书吧</label>
          <label><input type="checkbox" value="屋顶花园"> 屋顶花园</label>
          <label><input type="checkbox" value="洗衣房"> 洗衣房</label>
          <label><input type="checkbox" value="共享客厅"> 共享客厅</label>
          <label><input type="checkbox" value="共享厨房"> 共享厨房</label>
          <label><input type="checkbox" value="智能门禁"> 智能门禁</label>
          <label><input type="checkbox" value="监控系统"> 监控系统</label>
        </div>
      </div>
    </div>

    <!-- TAB: 图片素材 -->
    <div class="panel" id="p-media">
      <div class="card">
        <h3>配套图片 <span style="font-size:11px;color:#9CA3AF;font-weight:400">勾选配套后可上传对应图片</span></h3>
        <div class="hint" style="margin-bottom:10px">勾选要展示的配套，然后上传对应图片。留空则使用占位图。</div>
        <div class="amenity-checkbox-row" id="mediaAmenityChecks">
          <label><input type="checkbox" value="健身房" data-key="gym"> 🏋️ 健身房</label>
          <label><input type="checkbox" value="书吧" data-key="library"> 📚 书吧</label>
          <label><input type="checkbox" value="屋顶花园" data-key="rooftop"> 🌿 屋顶花园</label>
          <label><input type="checkbox" value="洗衣房" data-key="laundry"> 👔 洗衣房</label>
          <label><input type="checkbox" value="共享客厅" data-key="living"> 🛋️ 共享客厅</label>
          <label><input type="checkbox" value="共享厨房" data-key="kitchen"> 🍳 共享厨房</label>
        </div>
        <div class="amenity-linked-list" id="mediaAmenityUploads"></div>
      </div>
      <div class="card">
        <h3>地图与二维码</h3>
        <div id="mapQrFields"></div>
      </div>
      <div class="card">
        <h3>社媒二维码</h3>
        <div class="hint" style="margin-bottom:10px">上传小红书和公众号的二维码图片，会在预览中展示。</div>
        <div id="socialMediaFields"></div>
      </div>
    </div>

    <!-- TAB: 位置联系 -->
    <div class="panel" id="p-contact">
      <div class="card">
        <h3>位置信息</h3>
        <div class="fr"><label>详细地址</label><textarea id="f_address" rows="2" placeholder="武汉市..."></textarea></div>
        <div class="fr"><label>交通信息</label><input type="text" id="f_subway" placeholder="距地铁19号线花山河站1.2公里"></div>
        <div class="fr"><label>周边描述</label><textarea id="f_surrounding" rows="2" placeholder="商业、学校、医院等周边配套..."></textarea></div>
      </div>
      <div class="card">
        <h3>联系方式</h3>
        <div class="fr"><label>联系电话</label><input type="text" id="f_phone" placeholder="17786407261"></div>
        <div class="fr"><label>微信</label><input type="text" id="f_wechat"></div>
        <div class="fr"><label>管家姓名</label><input type="text" id="f_manager"></div>
        <div class="fr"><label>📕 小红书号</label><input type="text" id="f_xiaohongshu" placeholder="如: 租房数据局"></div>
        <div class="fr"><label>💬 微信公众号</label><input type="text" id="f_gongzhonghao" placeholder="如: 花山河泊寓"></div>
      </div>
    </div>
  </div>

  <!-- Right: Preview -->
  <div class="col-prev">
    <div class="prev-head">
      <h3>📱 实时预览</h3>
      <button type="button" class="btn btn-p" id="btnRefresh" style="padding:6px 14px;font-size:12px">🔄 刷新</button>
    </div>
    <div class="style-row">
      <button type="button" class="st-btn on" data-style="warm-editorial">🎨 暖调编辑</button>
      <button type="button" class="st-btn" data-style="modern-minimal">◻️ 现代极简</button>
      <button type="button" class="st-btn" data-style="dark-premium">🌙 暗色尊享</button>
      <button type="button" class="st-btn" data-style="clean-corporate">🏢 商务简洁</button>
    </div>
    <iframe class="prev-frame" id="previewFrame"></iframe>
    <div class="card export-card" style="margin-top:14px">
      <h3>📦 导出选项</h3>
      <div class="bg">
        <button type="button" class="btn btn-p" id="btnExportHtml">导出展示页 HTML</button>
        <button type="button" class="btn btn-g" id="btnExportJson">导出当前数据 JSON</button>
        <button type="button" class="btn btn-d" id="btnExportPdf">📄 导出 PDF</button>
      </div>
      <div class="info-box">
        💡 <strong>提示：</strong>数据自动保存到浏览器。导出HTML后可独立使用，无需本编辑器。图片会一起打包到导出文件中。
      </div>
    </div>

  <div class="card gen-card">
    <h3>📱 内容生成</h3>
    <p class="gen-desc">基于当前门店信息，一键生成适合各平台的宣传内容。</p>
    <div class="gen-btns">
      <button type="button" class="btn btn-g" id="btnGenGzh">
        <span>💬</span>
        <div class="gen-btn-text">
          <div class="gen-btn-title">生成公众号排版</div>
          <div class="gen-btn-sub">适合微信公众号图文</div>
        </div>
      </button>
      <button type="button" class="btn btn-d" id="btnGenXhs">
        <span>📕</span>
        <div class="gen-btn-text">

/* ── Get all form data ── */
function getData(){
  var d = {units:[], media:{}, amenities:[]};
  var i,el;
  for(i=0;i<STRAIGHT.length;i++){
    el = document.getElementById('f_'+STRAIGHT[i]);
    if(el) d[STRAIGHT[i]] = el.value;
  }
  d.brandLogo = imageStore.brandLogo || '';
  d.heroImage = imageStore.heroImage || '';
  for(i=0;i<MEDIA.length;i++){
    d.media[MEDIA[i]] = imageStore[MEDIA[i]] || '';
  }
  var cbs = document.querySelectorAll('#amenityChecks input:checked');
  for(i=0;i<cbs.length;i++) d.amenities.push(cbs[i].value);
  var uin = document.querySelectorAll('.unit-in');
  for(i=0;i<uin.length;i++){
    var idx=parseInt(uin[i].dataset.idx,10), field=uin[i].dataset.field;
    if(!d.units[idx]) d.units[idx]={name:'',area:'',price:'',desc:''};
    d.units[idx][field] = uin[i].value;
  }
  // Collect unit images (unit_0, unit_1, ...)
  for(var ui=0; ui<d.units.length; ui++){
    var ukey = 'unit_'+ui;
    d.media[ukey] = imageStore[ukey] || '';
  }
  return d;
}

/* ── Save ── */
function save(){
  try{ localStorage.setItem(SKEY, JSON.stringify(getData())); }catch(e){
    if(e.name==='QuotaExceededError') toast('⚠️ 存储空间不足，建议导出JSON后清理缓存');
  }
}
function load(){ try{ var s=localStorage.getItem(SKEY); if(s) return JSON.parse(s); }catch(e){} return null; }

/* ── Fill form ── */
function fillForm(d){
  var i,el;
  for(i=0;i<STRAIGHT.length;i++){
    el = document.getElementById('f_'+STRAIGHT[i]);
    if(el && d[STRAIGHT[i]]!==undefined) el.value = d[STRAIGHT[i]];
  }
  imageStore.brandLogo = d.brandLogo || '';
  imageStore.heroImage = d.heroImage || '';
  loadImagePreview('brandLogo', imageStore.brandLogo);
  loadImagePreview('heroImage', imageStore.heroImage);
  for(i=0;i<MEDIA.length;i++){
    var val = (d.media && d.media[MEDIA[i]]) ? d.media[MEDIA[i]] : '';
    imageStore[MEDIA[i]] = val;
    loadImagePreview(MEDIA[i], val);
  }
  var cbs = document.querySelectorAll('#amenityChecks input');
  for(i=0;i<cbs.length;i++) cbs[i].checked = d.amenities && d.amenities.indexOf(cbs[i].value)>=0;
  // Sync media tab checkboxes too
  if(typeof syncAmenityCheckboxes === 'function') syncAmenityCheckboxes();
  if(typeof updateAmenityUploadVisibility === 'function') updateAmenityUploadVisibility();
  // Load unit images from media into imageStore
  if(d.media){
    var uk = 0;
    while(d.media['unit_'+uk] !== undefined){
      imageStore['unit_'+uk] = d.media['unit_'+uk] || '';
      uk++;
    }
  }
  renderUnits(d.units || []);
  // Refresh unit thumb previews after render (since render builds DOM)
  var unitCount = (d.units || []).length;
  for(var ui=0; ui<unitCount; ui++){
    var ukey = 'unit_'+ui;
    loadImagePreview(ukey, imageStore[ukey] || '');
  }
}

/* ── Image Compression ── */
function compressImage(file, maxW, maxH, quality, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var w=img.width, h=img.height;
      var ratio = Math.min(maxW/w, maxH/h, 1);
      w=Math.round(w*ratio); h=Math.round(h*ratio);
      var canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ toast('❌ 图片读取失败'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ── Image Preview ── */
function loadImagePreview(key, dataUrl){
  var thumb = document.getElementById('thumb_'+key);
  var removeBtn = document.querySelector('.upload-remove[data-key="'+key+'"]');
  var unitRemoveBtn = document.querySelector('.unit-img-remove[data-key="'+key+'"]');
  if(!thumb) return;
  if(dataUrl){
    thumb.src = dataUrl;
    thumb.style.display = 'block';
    if(removeBtn) removeBtn.style.display = '';
    if(unitRemoveBtn) unitRemoveBtn.style.display = '';
  } else {
    thumb.src = '';
    thumb.style.display = 'none';
    if(removeBtn) removeBtn.style.display = 'none';
    if(unitRemoveBtn) unitRemoveBtn.style.display = 'none';
  }
}

/* ── Render Media Fields ── */
function renderMediaFields(){
  var ak = ['gym','library','rooftop','laundry','living','kitchen'];
  var mk = ['map','qrcode'];
  var sk = ['xiaohongshu','gongzhonghao'];
  var h2='', h3='';
  // Linked amenity uploads - render all but show/hide based on checkbox
  var list = document.getElementById('mediaAmenityUploads');
  if(list){
    var listHtml = '';
    for(var i=0;i<ak.length;i++){
      listHtml += buildLinkedAmenityField(ak[i]);
    }
    list.innerHTML = listHtml;
  }
  for(var j=0;j<mk.length;j++) h2 += buildUploadField(mk[j]);
  for(var k=0;k<sk.length;k++) h3 += buildUploadField(sk[k]);
  document.getElementById('mapQrFields').innerHTML = h2;
  var sf = document.getElementById('socialMediaFields');
  if(sf) sf.innerHTML = h3;
  // Sync checkbox state and update visibility
  syncAmenityCheckboxes();
  updateAmenityUploadVisibility();
}
function buildLinkedAmenityField(key){
  var label = MEDIA_LABELS[key] || key;
  var h = '<div class="amenity-linked-item" data-key="'+key+'" id="ali_'+key+'">';
  h += '<div class="amenity-linked-body" style="display:none">';
  h += '<div class="upload-field">';
  h += '<img id="thumb_'+key+'" class="upload-thumb" style="display:none" alt="">';
  h += '<div class="upload-controls">';
  h += '<button type="button" class="upload-btn" data-key="'+key+'">📁 选择图片</button>';
  h += '<button type="button" class="crop-btn" data-action="crop">✂ 裁剪</button>
                <button type="button" class="upload-remove" data-key="'+key+'" style="display:none">✕ 移除</button>';
  h += '<div class="upload-hint">建议 4:3 横版</div>';
  h += '</div></div></div></div>';
  return h;
}
function syncAmenityCheckboxes(){
  // Sync state from #amenityChecks to #mediaAmenityChecks
  var srcChecks = document.querySelectorAll('#amenityChecks input[type="checkbox"]');
  var srcMap = {};
  for(var i=0;i<srcChecks.length;i++){
    srcMap[srcChecks[i].value] = srcChecks[i].checked;
  }
  var dstChecks = document.querySelectorAll('#mediaAmenityChecks input[type="checkbox"]');
  for(var j=0;j<dstChecks.length;j++){
    var val = dstChecks[j].value;
    if(srcMap[val] !== undefined){
      dstChecks[j].checked = srcMap[val];
    }
  }
}
function updateAmenityUploadVisibility(){
  var checks = document.querySelectorAll('#mediaAmenityChecks input[type="checkbox"]');
  for(var i=0;i<checks.length;i++){
    var key = checks[i].dataset.key;
    var item = document.getElementById('ali_'+key);
    if(!item) continue;
    var body = item.querySelector('.amenity-linked-body');
    if(!body) continue;
    if(checks[i].checked){
      item.classList.add('active');
      body.style.display = '';
    } else {
      item.classList.remove('active');
      body.style.display = 'none';
    }
  }
}
function buildUploadField(key){
  var label = MEDIA_LABELS[key] || key;
  var h = '<div class="fr"><label>'+label+'</label>';
  h += '<div class="upload-field">';
  h += '<img id="thumb_'+key+'" class="upload-thumb" style="display:none" alt="">';
  h += '<div class="upload-controls">';
  h += '<button type="button" class="upload-btn" data-key="'+key+'">📁 选择图片</button>';
  h += '<button type="button" class="crop-btn" data-action="crop">✂ 裁剪</button>
                <button type="button" class="upload-remove" data-key="'+key+'" style="display:none">✕ 移除</button>';
  h += '</div></div></div>';
  return h;
}

/* ── Image Upload Events ── */
function initImageUploads(){
  document.addEventListener('click', function(e){
    var isUploadBtn = e.target.classList.contains('upload-btn');
    var isUnitImgBtn = e.target.classList.contains('unit-img-btn');
    if(isUploadBtn || isUnitImgBtn){
      var key = e.target.dataset.key;
      var inp = document.createElement('input');
      inp.type='file'; inp.accept='image/jpeg,image/png,image/webp';
      inp.onchange = function(ev){
        var file = ev.target.files[0];
        if(!file) return;
        compressImage(file, 1200, 1200, 0.82, function(dataUrl){
          imageStore[key] = dataUrl;
          loadImagePreview(key, dataUrl);
          save();
          refreshPreview();
          toast('✅ 图片已上传');
        });
      };
      inp.click();
      return;
    }
    var isUploadRemove = e.target.classList.contains('upload-remove');
    var isUnitImgRemove = e.target.classList.contains('unit-img-remove');
    if(isUploadRemove || isUnitImgRemove){
      var key2 = e.target.dataset.key;
      imageStore[key2] = '';
      loadImagePreview(key2, '');
      save();
      refreshPreview();
      toast('已移除');
    }
  });
}

  if(!w){ toast('❌ 请允许弹窗以导出PDF'); return; }
  w.document.open();
  w.document.write(fullHtml);
  w.document.close();
  // Wait for images to load then print
  function tryPrint(){
    if(w.document.readyState === 'complete'){
      setTimeout(function(){
        w.focus();
        w.print();
      }, 500);
    } else {
      setTimeout(tryPrint, 200);
    }
  }
  w.addEventListener('load', function(){
    setTimeout(function(){
      w.focus();
      w.print();
    }, 800);
  });
  setTimeout(tryPrint, 300);
  toast('📄 正在生成PDF，请在打印对话框中选择"另存为PDF"');
}

function copyShareLink(){

    navigator.clipboard.writeText(fullHtml).then(function(){

    }).catch(function(){
      fallbackCopy(fullHtml);
    });

function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
    toast('✅ 展示页HTML已复制到剪贴板');
  }catch(e){
    toast('❌ 复制失败，请手动导出HTML');

  document.body.removeChild(ta);
}

      for(var k=0;k<ps.length;k++) ps[k].classList.remove('on');

    });
  }
  /* Styles */
  var stBtns = document.querySelectorAll('.st-btn');
  for(var i=0;i<stBtns.length;i++){
    stBtns[i].addEventListener('click', function(){
      for(var j=0;j<stBtns.length;j++) stBtns[j].classList.remove('on');
      this.classList.add('on');
      curStyle = this.dataset.style;
      refreshPreview();
    });
  }
  /* Auto-save */
  document.addEventListener('input', function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') save();
  });
  document.addEventListener('change', function(e){
    if(e.target.type==='checkbox') save();
  });
  /* Units */
  document.getElementById('btnAddUnit').addEventListener('click', function(){
    var d = getData();
    d.units.push({name:'',area:'',price:'',desc:''});
    var newIdx = d.units.length - 1;
    var newKey = 'unit_'+newIdx;
    if(imageStore[newKey] === undefined) imageStore[newKey] = '';
    renderUnits(d.units);
    save();
  });
  document.getElementById('unitList').addEventListener('click', function(e){
    if(e.target.classList.contains('unit-del')){
      var idx = parseInt(e.target.dataset.idx,10);
      var d = getData();
      d.units.splice(idx,1);
      renderUnits(d.units);
      save();
    }
  });
  /* Image uploads */
  renderMediaFields();
  initImageUploads();
  /* Amenity checkbox sync (both tabs) */
  function setupAmenityCheckboxSync(){
    function syncTo(source, targetId){
      var checks = document.querySelectorAll(targetId + ' input[type="checkbox"]');
      var srcMap = {};
      var srcChecks = document.querySelectorAll(source + ' input[type="checkbox"]');
      for(var s=0;s<srcChecks.length;s++){
        srcMap[srcChecks[s].value] = srcChecks[s].checked;
      }
      for(var t=0;t<checks.length;t++){
        if(srcMap[checks[t].value] !== undefined){
          checks[t].checked = srcMap[checks[t].value];
        }
      }
    }
    // Listen to changes in source tab
    document.getElementById('amenityChecks').addEventListener('change', function(e){
      if(e.target.type === 'checkbox'){
        syncTo('#amenityChecks', '#mediaAmenityChecks');
        updateAmenityUploadVisibility();
      }
    });
    // Listen to changes in media tab
    var mediaChecks = document.getElementById('mediaAmenityChecks');
    if(mediaChecks){
      mediaChecks.addEventListener('change', function(e){
        if(e.target.type === 'checkbox'){
          syncTo('#mediaAmenityChecks', '#amenityChecks');
          updateAmenityUploadVisibility();
          save();
          refreshPreview();
        }
      });
    }
  }
  setupAmenityCheckboxSync();
  /* Load data */
  var saved = load();
  if(saved && saved.brandName && saved.projectName){
    fillForm(saved);
  } else {
    fillForm(DEFAULTS);
    save();
  }
  /* Initial preview */
  refreshPreview();
  /* Buttons */
  document.getElementById('btnRefresh').addEventListener('click', refreshPreview);
  document.getElementById('btnCopyShare').addEventListener('click', copyShareLink);
  document.getElementById('btnSample').addEventListener('click', function(){
    if(confirm('确定用示例数据覆盖当前内容？')){
      fillForm(DEFAULTS);
      save();
      refreshPreview();
      toast('✅ 示例数据已填充');
    }
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    if(confirm('确定清除所有缓存并重置为默认数据？')){
      try{ localStorage.removeItem(SKEY); }catch(e){}
      fillForm(DEFAULTS);
      save();
      refreshPreview();
      toast('✅ 已重置');
    }
  });
  document.getElementById('btnExportHtml').addEventListener('click', exportHTML);
  document.getElementById('btnExportJson').addEventListener('click', exportJSON);
  document.getElementById('btnExportPdf').addEventListener('click', exportPDF);
  document.getElementById('btnGenGzh').addEventListener('click', generateGzhContent);
  document.getElementById('btnGenXhs').addEventListener('click', generateXhsContent);
  document.getElementById('btnSaveJson').addEventListener('click', function(){
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', function(e){

    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var d = JSON.parse(ev.target.result);
        fillForm(d);
        save();
        refreshPreview();
        toast('✅ 数据已加载');
      }catch(err){
        toast('❌ JSON解析失败');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
}



/* ── Image Cropping with CropperJS ── */
var cropState = {
  cropper: null,
  currentKey: '',
  originalImage: '',
  aspectRatio: NaN
};

function openCropModal(key) {
  var dataUrl = imageStore[key];
  if (!dataUrl) {
    toast('请先上传图片');
    return;
  }
  cropState.currentKey = key;
  cropState.originalImage = dataUrl;
  cropState.aspectRatio = NaN;

  var modal = document.getElementById('cropModal');
  var img = document.getElementById('cropImage');
  img.src = dataUrl;
  modal.style.display = 'flex';

  // Reset aspect buttons
  var aspectBtns = document.querySelectorAll('.crop-aspect-btn');
  for (var i = 0; i < aspectBtns.length; i++) {
    aspectBtns[i].classList.remove('on');
    if (aspectBtns[i].dataset.ratio === 'free') {
      aspectBtns[i].classList.add('on');
    }
  }

  // Initialize Cropper after a short delay for the modal to render
  setTimeout(function() {
    if (cropState.cropper) {
      cropState.cropper.destroy();
    }
    cropState.cropper = new Cropper(img, {
      viewMode: 1,
      dragMode: 'move',
      aspectRatio: NaN,
      autoCropArea: 0.85,
      restore: false,
      guides: true,
      center: true,
      highlight: false,
      cropBoxMovable: true,
      cropBoxResizable: true,
      toggleDragModeOnDblclick: false,
      background: true,
      responsive: true,
      ready: function() {
        updateCropSizeInfo();
      },
      crop: function() {
        updateCropSizeInfo();
      }
    });
  }, 100);
}

function closeCropModal() {
  var modal = document.getElementById('cropModal');
  modal.style.display = 'none';
  if (cropState.cropper) {
    cropState.cropper.destroy();
    cropState.cropper = null;
  }
  cropState.currentKey = '';
}

function updateCropSizeInfo() {
  if (!cropState.cropper) return;
  var data = cropState.cropper.getData();
  var info = document.getElementById('cropSizeInfo');
  if (info) {
    info.textContent = '输出尺寸: ' + Math.round(data.width) + ' × ' + Math.round(data.height) + ' px';
  }
}

function applyCrop() {
  if (!cropState.cropper || !cropState.currentKey) return;

  var canvas = cropState.cropper.getCroppedCanvas({
    maxWidth: 1600,
    maxHeight: 1600,
    imageSmoothingEnabled: true,
    imageSmoothingQuality: 'high'
  });

  if (!canvas) {
    toast('❌ 裁剪失败');
    return;
  }

  var dataUrl = canvas.toDataURL('image/jpeg', 0.88);
  imageStore[cropState.currentKey] = dataUrl;
  loadImagePreview(cropState.currentKey, dataUrl);
  save();
  refreshPreview();
  closeCropModal();
  toast('✅ 裁剪完成');
}

function setCropAspect(ratio) {
  if (!cropState.cropper) return;
  var r = (ratio === 'free') ? NaN : parseFloat(ratio);
  cropState.aspectRatio = r;
  cropState.cropper.setAspectRatio(r);
}

function initCropModal() {
  var modal = document.getElementById('cropModal');
  if (!modal) return;

  modal.addEventListener('click', function(e) {
    var action = e.target.dataset.action;
    if (action === 'close-crop') {
      closeCropModal();
    } else if (action === 'apply-crop') {
      applyCrop();
    } else if (action === 'crop') {
      // Find the closest upload button to get the key
      var btn = e.target.closest('.crop-btn');
      if (btn) {
        // Find the associated upload button or remove button to get key
        var parent = btn.closest('.upload-controls') || btn.closest('.unit-image-row') || btn.parentElement;
        if (parent) {
          var uploadBtn = parent.querySelector('.upload-btn[data-key]') || parent.querySelector('.unit-img-btn[data-key]') || parent.querySelector('.upload-remove[data-key]') || parent.querySelector('.unit-img-remove[data-key]');
          if (uploadBtn) {
            openCropModal(uploadBtn.dataset.key);
          }
        }
      }
    }
  });

  // Aspect ratio buttons
  var aspectBtns = document.querySelectorAll('.crop-aspect-btn');
  for (var i = 0; i < aspectBtns.length; i++) {
    aspectBtns[i].addEventListener('click', function() {
      for (var j = 0; j < aspectBtns.length; j++) {
        aspectBtns[j].classList.remove('on');
      }
      this.classList.add('on');
      setCropAspect(this.dataset.ratio);
    });
  }

  // Tool buttons
  var toolBtns = document.querySelectorAll('.crop-tool-btn');
  for (var i = 0; i < toolBtns.length; i++) {
    toolBtns[i].addEventListener('click', function() {
      if (!cropState.cropper) return;
      var tool = this.dataset.tool;
      switch (tool) {
        case 'rotateLeft':
          cropState.cropper.rotate(-90);
          break;
        case 'rotateRight':
          cropState.cropper.rotate(90);
          break;
        case 'flipH':
          var dataX = cropState.cropper.getData().scaleX || 1;
          cropState.cropper.scaleX(-dataX);
          break;
        case 'flipV':
          var dataY = cropState.cropper.getData().scaleY || 1;
          cropState.cropper.scaleY(-dataY);
          break;
        case 'zoomIn':
          cropState.cropper.zoom(0.1);
          break;
        case 'zoomOut':
          cropState.cropper.zoom(-0.1);
          break;
        case 'reset':
          cropState.cropper.reset();
          break;
      }
    });
  }

  // Also handle clicks on crop buttons in the editor (delegated)
  document.addEventListener('click', function(e) {
    if (e.target.classList.contains('crop-btn') && !e.target.closest('#cropModal')) {
      e.preventDefault();
      var btn = e.target;
      // Find the key from nearby elements
      var parent = btn.closest('.upload-controls') || btn.closest('.unit-image-row') || btn.parentElement;
      if (parent) {
        var keyEl = parent.querySelector('[data-key]');
        if (keyEl && keyEl.dataset.key) {
          openCropModal(keyEl.dataset.key);
        }
      }
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    var modal = document.getElementById('cropModal');
    if (modal && modal.style.display === 'flex') {
      if (e.key === 'Escape') {
        closeCropModal();
      } else if (e.key === 'Enter' && e.ctrlKey) {
        applyCrop();
      }
    }
  });
}

  // Generate title
  var title = '【' + (data.projectName || '泊寓') + '探店】' + (data.city || '') + (data.tagline || '超美公寓大公开') + '✨';

  // Generate body content in Xiaohongshu style
  var body = '';
  body += '姐妹们！今天给大家安利一个超绝的公寓——' + (data.brandName || '') + '·' + (data.projectName || '') + '📍' + (data.city || '') + '\n\n';

  if (data.description) {
    body += '💫 ' + data.description + '\n\n';
  }

  if (data.totalRooms || data.unitRange || data.priceRange) {
    body += '📊 基本信息：\n';
    if (data.totalRooms) body += '  · 共' + data.totalRooms + '间房，选择超多\n';
    if (data.unitRange) body += '  · 面积' + data.unitRange + '，总有一款适合你\n';
    if (data.priceRange) body += '  · ' + data.priceRange + '，性价比拉满\n';
    body += '\n';
  }

  if (units.length > 0) {
    body += '🏠 户型推荐：\n';
    for (var i = 0; i < units.length; i++) {
      var u = units[i];
      body += (i + 1) + '. ' + (u.name || '');
      if (u.area) body += ' | ' + u.area;
      if (u.price) body += ' | ' + u.price;
      body += '\n';
      if (u.desc) body += '   ' + u.desc + '\n';
    }
    body += '\n';
  }

  if (ams.length > 0) {
    body += '✨ 配套设施：\n';
    var displayAms = [];
    for (var j = 0; j < ams.length; j++) {
      var n = ams[j].replace(/^custom:/, '');
      displayAms.push(n);
    }
    body += displayAms.join(' | ') + '\n\n';
  }

  if (data.address || data.subway) {
    body += '📍 位置：\n';
    if (data.address) body += '  ' + data.address + '\n';
    if (data.subway) body += '  ' + data.subway + '\n';
    body += '\n';
  }

  if (data.phone || data.wechat) {
    body += '📞 联系方式：\n';
    if (data.phone) body += '  电话：' + data.phone + '\n';
    if (data.wechat) body += '  微信：' + data.wechat + '\n';
    body += '\n';
  }

  body += '———\n';
  body += '喜欢的宝子们记得点赞收藏哦❤️\n';
  body += '有问题欢迎评论区留言～\n\n';

  // Generate hashtags
  var tags = [];
  if (data.brandName) tags.push('#' + data.brandName);
  if (data.projectName) tags.push('#' + data.projectName);
  if (data.city) tags.push('#' + data.city + '租房');
  tags.push('#租房');
  tags.push('#公寓');
  tags.push('#长租公寓');
  tags.push('#青年公寓');
  tags.push('#好房推荐');
  tags.push('#租房攻略');
  body += tags.join(' ');

  // Generate the full xiaohongshu-style HTML preview
  var xhsHtml = '';
  xhsHtml += '<div style="max-width: 375px; margin: 0 auto; background: #fff; font-family: -apple-system, BlinkMacSystemFont, \'PingFang SC\', sans-serif; min-height: 100vh;">';

  // Hero image area
  if (data.heroImage) {
    xhsHtml += '<div style="width: 100%; aspect-ratio: 3/4; overflow: hidden; background: #f5f5f5;">';
    xhsHtml += '<img src="' + data.heroImage + '" style="width: 100%; height: 100%; object-fit: cover;" alt="">';
    xhsHtml += '</div>';
  }

  // Content card
  xhsHtml += '<div style="padding: 16px;">';
  xhsHtml += '<h1 style="font-size: 17px; font-weight: 700; color: #333; margin: 0 0 12px 0; line-height: 1.4;">' + title + '</h1>';
  xhsHtml += '<div style="font-size: 14px; color: #333; line-height: 1.6; white-space: pre-wrap; word-break: break-word;">' + body + '</div>';
  xhsHtml += '</div>';

  // Unit image gallery
  var unitImgs = [];
  for (var k = 0; k < units.length; k++) {
    var uimg = data.media['unit_' + k] || '';
    if (uimg) unitImgs.push({src: uimg, name: units[k].name || ''});
  }
  if (unitImgs.length > 0) {
    xhsHtml += '<div style="padding: 0 16px 16px;">';
    xhsHtml += '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">';
    for (var m = 0; m < Math.min(unitImgs.length, 4); m++) {
      xhsHtml += '<div style="aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #f5f5f5;">';
      xhsHtml += '<img src="' + unitImgs[m].src + '" style="width: 100%; height: 100%; object-fit: cover;" alt="' + unitImgs[m].name + '">';
      xhsHtml += '</div>';
    }
    xhsHtml += '</div></div>';
  }

  xhsHtml += '</div>';

  // Copy text to clipboard
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(title + '\n\n' + body).then(function() {
      showXhsPreview(xhsHtml, title + '\n\n' + body);
    }).catch(function() {
      showXhsPreview(xhsHtml, title + '\n\n' + body);
    });
  } else {
    showXhsPreview(xhsHtml, title + '\n\n' + body);
  }
}

function showXhsPreview(html, text) {
  var w = window.open('', '_blank', 'width=400,height=700');
  if (!w) {
    toast('❌ 请允许弹窗查看小红书图文');
    // Fallback: copy text
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    toast('✅ 小红书文案已复制到剪贴板');
    return;
  }
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小红书图文预览</title><style>body{margin:0;background:#f5f5f5;padding:10px;}.xhs-wrap{max-width:375px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);}.copy-hint{text-align:center;padding:12px;font-size:12px;color:#999;}</style></head><body>' + html + '<div class="copy-hint">💡 文案已复制到剪贴板，可直接粘贴到小红书</div></body></html>');
  w.document.close();
  toast('✅ 小红书图文已生成，文案已复制');
}

init();
})();
</script>

<!-- Crop Modal -->
<div class="crop-modal" id="cropModal" style="display:none;">
  <div class="crop-modal-backdrop" data-action="close-crop"></div>
  <div class="crop-modal-content">
    <div class="crop-modal-header">
      <h3>裁剪图片</h3>
      <button type="button" class="crop-modal-close" data-action="close-crop">×</button>
    </div>
    <div class="crop-modal-body">
      <div class="crop-container">
        <img id="cropImage" src="" alt="Crop preview">
      </div>
      <div class="crop-controls">
        <div class="crop-aspect-row">
          <span class="crop-label">比例:</span>
          <button type="button" class="crop-aspect-btn on" data-ratio="free">自由</button>
          <button type="button" class="crop-aspect-btn" data-ratio="1">1:1</button>
          <button type="button" class="crop-aspect-btn" data-ratio="1.333">4:3</button>
          <button type="button" class="crop-aspect-btn" data-ratio="1.778">16:9</button>
          <button type="button" class="crop-aspect-btn" data-ratio="0.75">3:4</button>
        </div>
        <div class="crop-tool-row">
          <button type="button" class="crop-tool-btn" data-tool="rotateLeft" title="向左旋转">↺</button>
          <button type="button" class="crop-tool-btn" data-tool="rotateRight" title="向右旋转">↻</button>
          <button type="button" class="crop-tool-btn" data-tool="flipH" title="水平翻转">⇋</button>
          <button type="button" class="crop-tool-btn" data-tool="flipV" title="垂直翻转">⇵</button>
          <button type="button" class="crop-tool-btn" data-tool="zoomIn" title="放大">+</button>
          <button type="button" class="crop-tool-btn" data-tool="zoomOut" title="缩小">−</button>
          <button type="button" class="crop-tool-btn" data-tool="reset" title="重置">↺</button>
        </div>
        <div class="crop-size-info" id="cropSizeInfo">输出尺寸: --</div>
      </div>
    </div>
    <div class="crop-modal-footer">
      <button type="button" class="btn btn-o" data-action="close-crop">取消</button>
      <button type="button" class="btn btn-p" data-action="apply-crop">确认裁剪</button>
    </div>
  </div>
</div>
</body>
</html>
