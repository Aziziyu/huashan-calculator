function bindCalcEvents() {
  // 楼栋切换
  $$('.calc-bldg-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      $$('.calc-bldg-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      calcState.currentBldg = tab.dataset.calcB;
      const hintEl = $('#calcHintTxt');
      const inputEl = $('#calcRoomInput');
      if (hintEl) hintEl.textContent = calcBldgHint[calcState.currentBldg];
      if (inputEl) {
        inputEl.placeholder = '如 ' + calcBldgEg[calcState.currentBldg] + ' 或 ' + calcState.currentBldg + '-' + calcBldgEg[calcState.currentBldg];
      }
      calcRender();
    });
  });

  // 房间号输入
  const roomInput = $('#calcRoomInput');
  if (roomInput) roomInput.addEventListener('input', calcRender);

  // 填示例
  const fillEg = $('#calcFillEg');
  if (fillEg) fillEg.addEventListener('click', () => {
    const inputEl = $('#calcRoomInput');
    if (inputEl) {
      inputEl.value = calcBldgEg[calcState.currentBldg];
      calcRender();
    }
  });

  // 折扣按钮
  $$('.calc-discount-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('.calc-discount-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.calcRate === 'custom') {
        $('#calcCustomRow').classList.add('show');
        const ci = $('#calcCustomRateInput');
        if (ci) ci.focus();
        return;
      }
      $('#calcCustomRow').classList.remove('show');
      calcState.currentRate = parseFloat(btn.dataset.calcRate);
      calcState.currentLabel = calcRateLabels[btn.dataset.calcRate] || calcRateToZhe(calcState.currentRate);
      calcRender();
    });
  });

  // 自定义折扣确定
  const customApply = $('#calcCustomApply');
  if (customApply) customApply.addEventListener('click', () => {
    const val = parseInt($('#calcCustomRateInput').value);
    if (isNaN(val) || val < 86 || val > 100) {
      showToast('⚠️ 请输入86~100之间的整数');
      return;
    }
    calcState.currentRate = val / 100;
    calcState.currentLabel = '限时长租折扣 ' + val + '折';
    calcRateLabels[calcState.currentRate.toFixed(2)] = calcState.currentLabel;
    $('#calcCustomRow').classList.remove('show');
    calcRender();
  });

  const customInput = $('#calcCustomRateInput');
  if (customInput) customInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('#calcCustomApply').click();
  });

  // 叠加折扣勾选
  const stackToggle = $('#calcStackToggle');
  if (stackToggle) stackToggle.addEventListener('click', () => {
    calcState.stackEnabled = !calcState.stackEnabled;
    const check = $('#calcStackCheck');
    const group = $('#calcStackGroup');
    if (calcState.stackEnabled) {
      check.classList.add('on');
      group.classList.remove('disabled');
    } else {
      check.classList.remove('on');
      group.classList.add('disabled');
    }
    calcRender();
  });

  // 叠加折扣档位
  $$('.calc-stack-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!calcState.stackEnabled) return;
      $$('.calc-stack-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calcState.stackRate = parseFloat(btn.dataset.calcSrate);
      calcState.stackLabel = '叠加' + calcRateToZhe(calcState.stackRate);
      calcRender();
    });
  });

  // 复制报价
  const copyShort = $('#calcCopyShort');
  if (copyShort) copyShort.addEventListener('click', () => calcCopyResult('short'));
  const copyFull = $('#calcCopyFull');
  if (copyFull) copyFull.addEventListener('click', () => calcCopyResult('full'));

  // 复制首期账单
  const copyBill = $('#calcCopyBill');
  if (copyBill) copyBill.addEventListener('click', calcCopyBillResult);

  // 日期变更
  const billDate = $('#calcBillStartDate');
  if (billDate) billDate.addEventListener('change', calcRenderFirstBill);

  // 弹窗关闭
  const modalClose = $('#calcModalClose');
  const modalCancel = $('#calcModalCancel');
  const modalMask = $('#calcCopyModal');
  if (modalClose) modalClose.addEventListener('click', calcCloseCopyModal);
  if (modalCancel) modalCancel.addEventListener('click', calcCloseCopyModal);
  if (modalMask) modalMask.addEventListener('click', (e) => {
    if (e.target.id === 'calcCopyModal') calcCloseCopyModal();
  });
  const modalCopy = $('#calcModalCopy');
  if (modalCopy) modalCopy.addEventListener('click', calcDoCopy);
}

function calcRender() {
  const errEl = $('#calcErrMsg');
  const detailEl = $('#calcDetailCard');
  const originalEl = $('#calcOriginalCard');
  const resultEl = $('#calcResultCard');
  const firstBillEl = $('#calcFirstBillCard');
  const emptyEl = $('#calcEmptyCard');

  const inputVal = $('#calcRoomInput').value;
  if (!inputVal.trim()) {
    if (errEl) errEl.classList.remove('show');
    if (detailEl) detailEl.style.display = 'none';
    if (originalEl) originalEl.style.display = 'none';
    if (resultEl) resultEl.style.display = 'none';
    if (firstBillEl) firstBillEl.style.display = 'none';
    if (emptyEl) emptyEl.style.display = 'block';
    calcState.currentRoom = null;
    return;
  }

  const parsed = calcParseInput(inputVal);
  if (!parsed) {
    if (errEl) { errEl.textContent = '⚠️ 房号格式错误，请输入如 101 或 G11-101'; errEl.classList.add('show'); }
    if (detailEl) detailEl.style.display = 'none';
    if (originalEl) originalEl.style.display = 'none';
    if (resultEl) resultEl.style.display = 'none';
    if (firstBillEl) firstBillEl.style.display = 'none';
    if (emptyEl) emptyEl.style.display = 'none';
    return;
  }

  if (!roomIdx[parsed.b] || !roomIdx[parsed.b][parsed.room]) {
    if (errEl) { errEl.textContent = '⚠️ 未找到 ' + parsed.b + '-' + parsed.room + '（' + calcBldgHint[parsed.b] + '）'; errEl.classList.add('show'); }
    if (detailEl) detailEl.style.display = 'none';
    if (originalEl) originalEl.style.display = 'none';
    if (resultEl) resultEl.style.display = 'none';
    if (firstBillEl) firstBillEl.style.display = 'none';
    if (emptyEl) emptyEl.style.display = 'none';
    return;
  }

  const room = roomIdx[parsed.b][parsed.room];
  if (errEl) errEl.classList.remove('show');
  if (emptyEl) emptyEl.style.display = 'none';
  if (detailEl) detailEl.style.display = 'block';
  if (originalEl) originalEl.style.display = 'block';
  if (resultEl) resultEl.style.display = 'block';
  if (firstBillEl) firstBillEl.style.display = 'block';
  calcState.currentRoom = room;

  // 房源信息
  const tagClass = calcTypeTagMap[room.t] || '';
  const shortType = calcTypeShortMap[room.t] || room.t;
  const dRoom = $('#calcDRoom'); if (dRoom) dRoom.innerHTML = room.b + '-' + room.r;
  const dFloor = $('#calcDFloor'); if (dFloor) dFloor.textContent = room.f + ' 楼';
  const dType = $('#calcDType'); if (dType) dType.innerHTML = room.t + ' <span class="calc-tag ' + tagClass + '">' + shortType + '</span>';
  const dArea = $('#calcDArea'); if (dArea) dArea.textContent = room.a.toFixed(2) + ' ㎡';
  const isOn = room.s === '已上架';
  const dStatus = $('#calcDStatus'); if (dStatus) dStatus.innerHTML = '<span class="calc-tag ' + (isOn ? 'calc-tag-on' : 'calc-tag-off') + '">' + room.s + '</span>';

  // 挂牌原价
  const signRent = room.p;
  const oriFee = signRent * 0.10;
  const oriTotal = signRent + oriFee;
  const pRent = $('#calcPRent'); if (pRent) pRent.textContent = calcFmt(signRent) + ' 元';
  const pFee = $('#calcPFee'); if (pFee) pFee.textContent = calcFmt(oriFee) + ' 元';
  const pTotal = $('#calcPTotal'); if (pTotal) pTotal.textContent = calcFmt(oriTotal) + ' 元';

  // 折后
  const finalRate = calcState.currentRate * (calcState.stackEnabled ? calcState.stackRate : 1);
  const newRent = signRent * finalRate;
  const newFee = newRent * 0.10;
  const newTotal = newRent + newFee;
  const save = oriTotal - newTotal;

  let badgeTxt = calcState.currentLabel;
  if (calcState.stackEnabled) {
    badgeTxt = calcState.currentLabel + ' × ' + calcState.stackLabel;
  }
  const rBadge = $('#calcRBadge'); if (rBadge) rBadge.textContent = badgeTxt;

  let rentSuffix = '';
  if (finalRate < 1) {
    rentSuffix = '（' + calcRateToZhe(finalRate) + '）';
  }
  const rRent = $('#calcRRent'); if (rRent) rRent.textContent = calcFmt(newRent) + ' 元' + rentSuffix;
  const rFee = $('#calcRFee'); if (rFee) rFee.textContent = calcFmt(newFee) + ' 元';
  const rTotal = $('#calcRTotal'); if (rTotal) rTotal.innerHTML = calcFmt(newTotal) + '<small>元/月</small>';

  const rSave = $('#calcRSave');
  if (rSave) {
    if (finalRate < 1) {
      let saveTxt = '💰 每月省 <b>' + calcFmt(save) + '</b> 元 · 年省 <b>' + calcFmt(save * 12) + '</b> 元';
      if (calcState.stackEnabled) {
        saveTxt += '<div class="calc-combo-line">综合折扣：' + calcRateToZhe(calcState.currentRate) + ' × ' + calcRateToZhe(calcState.stackRate) + ' = ' + calcRateToZhe(finalRate) + '</div>';
      }
      rSave.innerHTML = saveTxt;
      rSave.style.display = 'block';
    } else {
      rSave.style.display = 'none';
    }
  }

  calcRenderFirstBill();
}

// 首期账单计算
function calcGetBillData() {
  if (!calcState.currentRoom) return null;
  const r = calcState.currentRoom;
  const signRent = r.p;
  const finalRate = calcState.currentRate * (calcState.stackEnabled ? calcState.stackRate : 1);
  const newRent = signRent * finalRate;
  const newFee = newRent * 0.10;
  const deposit = newRent;

  let billRent, billFee, billHint, daysLeft = 0, daysInMonth = 0;

  if (r.b === 'G11') {
    const startDateStr = $('#calcBillStartDate').value;
    if (!startDateStr) {
      return { rent: 0, fee: 0, deposit: deposit, total: 0, isG11: true, noDate: true, newRent, newFee, daysLeft: 0, daysInMonth: 0 };
    }
    const sd = new Date(startDateStr + 'T00:00:00');
    const y = sd.getFullYear(), m = sd.getMonth();
    const lastDay = new Date(y, m + 1, 0).getDate();
    daysInMonth = lastDay;
    daysLeft = daysInMonth - sd.getDate() + 1;
    if (daysLeft <= 0) daysLeft = 0;
    const dailyRent = newRent / daysInMonth;
    const dailyFee = newFee / daysInMonth;
    billRent = dailyRent * daysLeft;
    billFee = dailyFee * daysLeft;
    billHint = '起租 ' + (sd.getMonth() + 1) + '/' + sd.getDate() + ' → 月底 ' + daysLeft + '天 / 全月 ' + daysInMonth + '天';
  } else {
    billRent = newRent;
    billFee = newFee;
    billHint = 'G10 按整月计算';
  }

  const total = billRent + billFee + deposit;
  return {
    rent: billRent, fee: billFee, deposit: deposit, total: total,
    newRent: newRent, newFee: newFee,
    isG11: r.b === 'G11', noDate: false, hint: billHint,
    daysLeft: daysLeft, daysInMonth: daysInMonth
  };
}

function calcRenderFirstBill() {
  if (!calcState.currentRoom) return;

  const dateRow = $('#calcBillDateRow');
  if (dateRow) {
    if (calcState.currentRoom.b === 'G11') {
      dateRow.style.display = 'flex';
      const billDate = $('#calcBillStartDate');
      if (billDate && !billDate.value) {
        const today = new Date();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        billDate.value = today.getFullYear() + '-' + mm + '-' + dd;
      }
    } else {
      dateRow.style.display = 'none';
    }
  }

  const d = calcGetBillData();
  if (!d) return;

  const rentLabel = $('#calcBsRentLabel');
  const feeLabel = $('#calcBsFeeLabel');
  if (d.isG11) {
    if (rentLabel) rentLabel.textContent = '折算租金（' + d.daysLeft + '天）';
    if (feeLabel) feeLabel.textContent = '折算服务费（' + d.daysLeft + '天）';
  } else {
    if (rentLabel) rentLabel.textContent = '首月租金（折后）';
    if (feeLabel) feeLabel.textContent = '服务费（首月）';
  }

  const bsRent = $('#calcBsRent'); if (bsRent) bsRent.textContent = d.noDate ? '请选择起租日期' : calcFmt(d.rent) + ' 元';
  const bsFee = $('#calcBsFee'); if (bsFee) bsFee.textContent = d.noDate ? '-' : calcFmt(d.fee) + ' 元';
  const bsDeposit = $('#calcBsDeposit'); if (bsDeposit) bsDeposit.textContent = calcFmt(d.deposit) + ' 元';
  const bsTotal = $('#calcBsTotal'); if (bsTotal) bsTotal.textContent = d.noDate ? '-' : calcFmt(d.total) + ' 元';

  const tipEl = $('#calcBillFormulaTip');
  if (tipEl) {
    if (d.isG11 && !d.noDate) {
      tipEl.innerHTML = '📐 G11首期 = 起租日至月底租金按天折算 + 服务费按天折算 + 押金（1个月租金，不含服务费）<br>当前：' + d.hint;
    } else if (!d.isG11) {
      tipEl.innerHTML = '📐 G10首期 = 月租金 + 服务费 + 押金（1个月租金，不含服务费）';
    }
  }
}

function calcCopyResult(mode) {
  if (!calcState.currentRoom) { showToast('请先输入房间号'); return; }
  const r = calcState.currentRoom;
  const signRent = r.p;
  const finalRate = calcState.currentRate * (calcState.stackEnabled ? calcState.stackRate : 1);
  const newRent = signRent * finalRate;
  const newFee = newRent * 0.10;
  const newTotal = newRent + newFee;
  const comboLabel = calcState.stackEnabled ? (calcState.currentLabel + ' × ' + calcState.stackLabel) : calcState.currentLabel;
  const comboRateTxt = calcState.stackEnabled
    ? (calcRateToZhe(calcState.currentRate) + ' × ' + calcRateToZhe(calcState.stackRate) + ' = ' + calcRateToZhe(finalRate))
    : calcRateToZhe(calcState.currentRate);

  let text;
  if (mode === 'short') {
    text = '━━━ 报价单 ━━━\n【花山河 ' + r.b + '-' + r.r + '】' + r.t + ' · ' + r.f + '楼 · ' + r.a.toFixed(2) + '㎡\n' + comboLabel + '：租金 ' + calcFmt(newRent) + ' + 服务费 ' + calcFmt(newFee) + ' = ' + calcFmt(newTotal) + ' 元/月';
  } else {
    const oriTotal = signRent * 1.1;
    text = '━━━ 报价单 ━━━\n交投泊寓·花山河店\n\n📍 房号：' + r.b + '-' + r.r + '（' + r.f + '楼）\n🏠 户型：' + r.t + '\n📐 面积：' + r.a.toFixed(2) + ' ㎡\n\n【挂牌原价】\n签约租金：' + calcFmt(signRent) + ' 元\n服务费(10%)：' + calcFmt(signRent * 0.1) + ' 元\n月付总价：' + calcFmt(oriTotal) + ' 元\n\n【' + comboLabel + ' 折后】\n折扣计算：' + comboRateTxt + '\n签约租金：' + calcFmt(newRent) + ' 元\n服务费(10%)：' + calcFmt(newFee) + ' 元\n月付总价：' + calcFmt(newTotal) + ' 元\n' + (finalRate < 1 ? '每月省 ' + calcFmt(oriTotal - newTotal) + ' 元 · 年省 ' + calcFmt((oriTotal - newTotal) * 12) + ' 元' : '');
  }

  const ta = $('#calcCopyText');
  if (ta) ta.value = text;
  const modal = $('#calcCopyModal');
  if (modal) modal.classList.add('show');
  setTimeout(() => calcTryAutoCopy(text), 100);
}

function calcTryAutoCopy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(
      () => showToast('✅ 已自动复制'),
      () => calcExecCopy(text)
    );
  } else {
    calcExecCopy(text);
  }
}

function calcExecCopy(text) {
  try {
    const ta = $('#calcCopyText');
    if (!ta) return;
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, 99999);
    const ok = document.execCommand('copy');
    if (ok) showToast('✅ 已自动复制');
  } catch (e) {}
}

function calcDoCopy() {
  const ta = $('#calcCopyText');
  const text = ta ? ta.value : '';
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(
      () => { showToast('✅ 已复制到剪贴板'); setTimeout(calcCloseCopyModal, 500); },
      () => { calcExecCopy(text); showToast('✅ 已复制'); setTimeout(calcCloseCopyModal, 500); }
    );
  } else {
    calcExecCopy(text);
    showToast('✅ 已复制');
    setTimeout(calcCloseCopyModal, 500);
  }
}

function calcCloseCopyModal() {
  const modal = $('#calcCopyModal');
  if (modal) modal.classList.remove('show');
}

function calcGetBillCopyText() {
  if (!calcState.currentRoom) return '';
  const d = calcGetBillData();
  if (!d || d.noDate) return '';

  let text = '';
  if (d.isG11) {
    const sd = new Date($('#calcBillStartDate').value + 'T00:00:00');
    text += '起租日期：' + (sd.getMonth() + 1) + '月' + sd.getDate() + '日\n';
    text += '折算天数：' + d.daysLeft + '天 / 全月' + d.daysInMonth + '天\n\n';
  }
  text += '💰 费用明细：\n';
  if (d.isG11) {
    text += '  折算租金（' + d.daysLeft + '天）：' + calcFmt(d.rent) + ' 元\n';
    text += '  折算服务费（' + d.daysLeft + '天）：' + calcFmt(d.fee) + ' 元\n';
  } else {
    text += '  首月租金：' + calcFmt(d.rent) + ' 元\n';
    text += '  服务费：' + calcFmt(d.fee) + ' 元\n';
  }
  text += '  押金（1个月租金）：' + calcFmt(d.deposit) + ' 元\n';
  text += '━━━━━━━━━━━━━━━\n';
  text += '  首期合计：' + calcFmt(d.total) + ' 元';
  return text;
}

function calcCopyBillResult() {
  if (!calcState.currentRoom) { showToast('请先输入房间号'); return; }
  const billText = calcGetBillCopyText();
  if (!billText) { showToast('请先选择起租日期'); return; }

  const r = calcState.currentRoom;
  const comboLabel = calcState.stackEnabled ? (calcState.currentLabel + ' × ' + calcState.stackLabel) : calcState.currentLabel;

function saveSetting(path, value) {
  const parts = path.split('.');
  let obj = store;
  for (let i = 0; i < parts.length - 1; i++) {
    obj = obj[parts[i]];
  }
  const last = parts[parts.length - 1];
  if (value === 'true' || value === 'false') {
    obj[last] = value === 'true';
  } else if (!isNaN(value) && value !== '' && typeof value === 'string') {
    obj[last] = parseFloat(value);
  } else {
    obj[last] = value;
  }
  saveStore();
}

// ----- 阶梯评分 -----
function saveStep(key, idx, value) {
  const cfg = store.scoringSteps[key];
  if (!cfg || !cfg.steps[idx]) return;
  const num = parseFloat(value) || 0;
  if (cfg.type === 'positive') cfg.steps[idx].min = num;
  else cfg.steps[idx].max = num;
  saveStore();
}

function saveStepScore(key, idx, value) {
  const cfg = store.scoringSteps[key];
  if (!cfg || !cfg.steps[idx]) return;
  cfg.steps[idx].score = parseFloat(value) || 0;
  saveStore();
}

function addStep(key) {
  const cfg = store.scoringSteps[key];
  if (!cfg) return;
  if (cfg.steps.length >= 5) { showToast('最多5档'); return; }
  if (cfg.type === 'positive') {
    cfg.steps.push({ min: 0, score: 0 });
  } else {
    cfg.steps.push({ max: 999, score: 0 });
  }
  saveStore();
  renderPage();
}

function removeStep(key) {
  const cfg = store.scoringSteps[key];
  if (!cfg) return;
  if (cfg.steps.length <= 2) { showToast('至少保留2档'); return; }
  cfg.steps.pop();
  saveStore();
  renderPage();
}

// ----- 拖拽排序（通用） -----
function setupDragLists() {
  const lists = ['buildingList', 'roomTypeList', 'staffList', 'channelList', 'myTodoList'];
  lists.forEach(listId => {
    const list = $('#' + listId);
    if (!list) return;
    const items = $$('li', list);
    let dragged = null;
    const dataKey = listId === 'buildingList' ? 'buildings' :
      listId === 'roomTypeList' ? 'roomTypes' :
      listId === 'staffList' ? 'staff' :
      listId === 'myTodoList' ? 'myTodos' : 'channels';

    items.forEach(item => {
      item.addEventListener('dragstart', e => {
        // 如果点击的是按钮或输入框，不触发拖拽（防止编辑/删除按钮被吞）
        if (e.target.closest('button') || e.target.closest('input')) {
          e.preventDefault();
          return;
        }
        dragged = item;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        items.forEach(i => i.classList.remove('drag-over'));
        dragged = null;
      });
      item.addEventListener('dragover', e => {
        e.preventDefault();
        if (dragged && dragged !== item) item.classList.add('drag-over');
      });
      item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
      item.addEventListener('drop', e => {
        e.preventDefault();
        item.classList.remove('drag-over');
        if (!dragged || dragged === item) return;
        const fromId = dragged.dataset.id;
        const toId = item.dataset.id;
        const arr = store[dataKey];
        const fromIdx = arr.findIndex(x => x.id === fromId);
        const toIdx = arr.findIndex(x => x.id === toId);
        if (fromIdx >= 0 && toIdx >= 0) {
          const [moved] = arr.splice(fromIdx, 1);
          arr.splice(toIdx, 0, moved);
          saveStore();
          renderPage();
        }
      });
    });
  });
}

const GITHUB_REPO_OWNER = 'Aziziyu';
const GITHUB_REPO_NAME = 'huashan-calculator';
const GITHUB_SYNC_FILE = 'sync-data/workstation.json';
const GITHUB_BRANCH = 'main';

let _autoSyncTimer = null;

function getGitHubPAT() {
  return localStorage.getItem('gh_pat_store') || '';
}

function setGitHubPAT(pat) {
  localStorage.setItem('gh_pat_store', pat);
}

function githubHeaders() {
  return {
    'Authorization': 'token ' + getGitHubPAT(),
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}

// 防抖自动同步：数据变化后 5 秒静默上传
function scheduleAutoSync() {
  if (_autoSyncTimer) clearTimeout(_autoSyncTimer);
  _autoSyncTimer = setTimeout(async () => {
    _autoSyncTimer = null;
    try {
      await syncUploadGitHub();
      updateSyncStatus();
      console.log('✅ 自动同步完成');
    } catch (e) {
      console.warn('⚠️ 自动同步失败，下次再试：', e.message);
    }
  }, 5000);
}

async function syncUploadGitHub() {
  const pat = getGitHubPAT();
  if (!pat) throw new Error('请先配置 GitHub PAT');

  const uploadStore = JSON.parse(JSON.stringify(store));
  uploadStore.cloudSync.pat = ''; // 不上传 PAT
  const jsonStr = JSON.stringify(uploadStore, null, 2);
  const b64 = btoa(unescape(encodeURIComponent(jsonStr)));

  // 获取当前文件的 SHA（如果已存在）
  const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_SYNC_FILE}?ref=${GITHUB_BRANCH}`;
  let currentSha = '';
  try {
    const getResp = await fetch(apiUrl, { headers: { 'Authorization': 'token ' + pat, 'Accept': 'application/vnd.github+json' } });
    if (getResp.ok) {
      const getData = await getResp.json();
      currentSha = getData.sha || '';
    }
  } catch (e) { /* 文件不存在，首次上传 */ }

  // 上传/更新文件
  const body = {
    message: currentSha ? 'auto-sync: update workstation data' : 'auto-sync: init workstation data',
    content: b64,
    branch: GITHUB_BRANCH
  };
  if (currentSha) body.sha = currentSha;

  const resp = await fetch(apiUrl, {
    method: 'PUT',
    headers: githubHeaders(),
    body: JSON.stringify(body)
  });
  if (!resp.ok) {
    const errData = await resp.json().catch(() => ({}));
    throw new Error('上传失败：' + (errData.message || resp.status));
  }
  store.cloudSync.lastSyncTime = new Date().toLocaleString('zh-CN');
  store.cloudSync.lastSyncDirection = 'upload';
  saveStore();
  return true;
}

async function syncDownloadGitHub() {
  const pat = getGitHubPAT();
  if (!pat) throw new Error('请先配置 GitHub PAT');

  const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_SYNC_FILE}?ref=${GITHUB_BRANCH}`;
  const resp = await fetch(apiUrl, { headers: { 'Authorization': 'token ' + pat, 'Accept': 'application/vnd.github+json' } });
  if (!resp.ok) {
    if (resp.status === 404) throw new Error('云端没有数据，请先上传一次');
    throw new Error('下载失败：' + resp.status);
  }
  const data = await resp.json();
  if (!data.content) throw new Error('云端数据为空');

  const jsonStr = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
  const cloudData = JSON.parse(jsonStr);
  if (!cloudData) throw new Error('云端数据解析失败');

  store = deepMerge(defaultStore, cloudData);
  store.cloudSync.lastSyncTime = new Date().toLocaleString('zh-CN');
  store.cloudSync.lastSyncDirection = 'download';
  saveStore();
  return true;
}

async function testGitHubConnection() {
  const pat = getGitHubPAT();
  if (!pat) throw new Error('请先输入 GitHub PAT');
  const resp = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}`, {
    headers: { 'Authorization': 'token ' + pat, 'Accept': 'application/vnd.github+json' }
  });
  if (!resp.ok) throw new Error('PAT 无效或仓库不存在 (' + resp.status + ')');
  return true;
}

async function autoSyncOnPageLoad() {
  const pat = getGitHubPAT();
  if (!pat) return; // 未配置 PAT，跳过
  if (!store.cloudSync.autoSync) return;

  try {
    const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_SYNC_FILE}?ref=${GITHUB_BRANCH}`;
    const resp = await fetch(apiUrl, { headers: { 'Authorization': 'token ' + pat, 'Accept': 'application/vnd.github+json' } });
    if (!resp.ok) return; // 文件不存在或网络问题，静默跳过

    const data = await resp.json();
    if (!data.content) return;

    const jsonStr = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
    const cloudData = JSON.parse(jsonStr);
    if (!cloudData) return;

    // 比较时间戳
    const localTime = store.cloudSync.lastSyncTime || '';
    const cloudTime = cloudData.cloudSync?.lastSyncTime || '';
    if (!localTime || cloudTime > localTime) {
      store = deepMerge(defaultStore, cloudData);
      saveStore();
      console.log('✅ 页面加载时自动同步了云端数据');
    }
  } catch (e) {
    console.warn('⚠️ 自动拉取失败：', e.message);
  }
}

function toggleSyncPanel() {
  const panel = document.getElementById('syncPanel');
  if (!panel) return;
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  if (panel.style.display === 'block') {
    updateSyncStatus();
  }
}

function updateSyncStatus() {
  const lastEl = document.getElementById('syncLastTime');
  const statusEl = document.getElementById('syncStatus');
  const autoEl = document.getElementById('syncAutoStatus');
  const pat = getGitHubPAT();
  if (lastEl && store.cloudSync.lastSyncTime) {
    lastEl.textContent = '最后同步：' + store.cloudSync.lastSyncTime;
  }
  if (autoEl) {
    if (!pat) {
      autoEl.textContent = '💤 未配置云同步';
      autoEl.style.color = '#999';
    } else if (store.cloudSync.autoSync) {
      autoEl.textContent = '🔄 自动同步已开启';
      autoEl.style.color = '#27AE60';
    } else {
      autoEl.textContent = '💤 自动同步已关闭';
      autoEl.style.color = '#F39C12';
    }
  }
  if (statusEl) {
    if (pat) {
      statusEl.textContent = '状态：已连接 GitHub ✅';
      statusEl.style.color = '#27AE60';
    } else {
      statusEl.textContent = '状态：未配置';
      statusEl.style.color = '#999';
    }
  }
  // 同步更新设置页的同步信息
  const infoEl = document.getElementById('ghSyncInfo');
  if (infoEl) {
    if (store.cloudSync.lastSyncTime) {
      const dir = store.cloudSync.lastSyncDirection === 'upload' ? '上传' : '下载';
      infoEl.textContent = '最后同步：' + store.cloudSync.lastSyncTime + '（' + dir + '）';
    } else {
      infoEl.textContent = '尚未同步';
    }
  }
}

async function doSyncUpload() {
  const statusEl = document.getElementById('syncStatus');
  try {
    if (statusEl) { statusEl.textContent = '状态：上传中...'; statusEl.style.color = '#F39C12'; }
    await syncUploadGitHub();
    if (statusEl) { statusEl.textContent = '状态：上传成功 ✅'; statusEl.style.color = '#27AE60'; }
    showToast('数据已上传到 GitHub');
    updateSyncStatus();
  } catch (e) {
    if (statusEl) { statusEl.textContent = '状态：上传失败 ❌'; statusEl.style.color = '#E74C3C'; }
    showToast('上传失败：' + (e.message || '未知错误'));
  }
}

async function doSyncDownload() {
  const statusEl = document.getElementById('syncStatus');
  try {
    if (statusEl) { statusEl.textContent = '状态：下载中...'; statusEl.style.color = '#F39C12'; }
    await syncDownloadGitHub();
    if (statusEl) { statusEl.textContent = '状态：下载成功 ✅'; statusEl.style.color = '#27AE60'; }
    showToast('数据已从 GitHub 下载');
    renderPage();
    updateSyncStatus();
  } catch (e) {
    if (statusEl) { statusEl.textContent = '状态：下载失败 ❌'; statusEl.style.color = '#E74C3C'; }
    showToast('下载失败：' + (e.message || '未知错误'));
  }
}

async function handleBindGitHub() {
  const statusEl = document.getElementById('ghConnStatus');
  const patInput = document.getElementById('githubPatInput');
  if (!patInput) { showToast('找不到输入框'); return; }
  const pat = patInput.value.trim();
  if (!pat) {
    showToast('请先输入 GitHub PAT');
    return;
  }
  setGitHubPAT(pat);
  if (statusEl) { statusEl.textContent = '正在测试连接...'; statusEl.style.color = '#F39C12'; }
  try {
    await testGitHubConnection();
    if (statusEl) { statusEl.textContent = '✅ PAT 有效，已绑定！'; statusEl.style.color = '#27AE60'; }
    showToast('GitHub PAT 绑定成功！');
    // 绑定成功后立即上传一次
    try {
      await syncUploadGitHub();
      showToast('数据已自动上传到 GitHub');
    } catch (e2) {
      console.warn('首次上传失败：', e2.message);
    }
    updateSyncStatus();
  } catch (e) {
    if (statusEl) { statusEl.textContent = '❌ ' + (e.message || '绑定失败'); statusEl.style.color = '#E74C3C'; }
    showToast('绑定失败：' + (e.message || '未知错误'));
  }
}

async function handleManualDownload() {
  if (!getGitHubPAT()) { showToast('请先绑定 GitHub PAT'); return; }
  await doSyncDownload();

// ----- 导入导出 -----
function exportData() {
  const dataStr = JSON.stringify(store, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `workstation_backup_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (confirm('导入将覆盖当前所有数据，确定继续？')) {
        store = deepMerge(defaultStore, data);
        saveStore();
        renderPage();
        showToast('导入成功');
      }
    } catch (err) {
      showToast('文件格式错误');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetData() {
  if (!confirm('确定重置所有数据吗？此操作不可恢复！')) return;
  if (!confirm('再次确认：所有业务数据将被清空，仅保留预设配置！')) return;
  store = JSON.parse(JSON.stringify(defaultStore));
  saveStore();
  renderPage();
  showToast('已重置');
}

// v6.0 绩效权重操作
function updatePerfWeight(key, val) {
  if (!store.perfWeights) store.perfWeights = { sales: 50, ops: 30, manager: 20 };
  store.perfWeights[key] = parseInt(val) || 0;
  var total = store.perfWeights.sales + store.perfWeights.ops + store.perfWeights.manager;
  var ws = document.getElementById('weightSales');
  var wo = document.getElementById('weightOps');
  var wm = document.getElementById('weightManager');
  var wt = document.getElementById('weightTotal');
  var btn = document.getElementById('saveWeightBtn');
  if (ws) ws.textContent = store.perfWeights.sales + '%';
  if (wo) wo.textContent = store.perfWeights.ops + '%';
  if (wm) wm.textContent = store.perfWeights.manager + '%';
  if (wt) {
    wt.textContent = total + '%';
    wt.style.color = total === 100 ? '#27AE60' : '#E74C3C';
  }
  if (btn) {
    btn.disabled = total !== 100;
    btn.style.opacity = total !== 100 ? '0.5' : '1';
  }
}

function savePerfWeights() {
  if (!store.perfWeights) return;
  var total = store.perfWeights.sales + store.perfWeights.ops + store.perfWeights.manager;
  if (total !== 100) { showToast('权重合计必须等于100%'); return; }
  saveStore();
  showToast('权重已保存');
  renderOpTabBody();
}

function editSignTargets() {
  var targets = store.signTargets || { base: 10, stretch: 15 };
  var html = '<div class="form-group"><label>基础目标（单/月）</label>' +
    '<input type="number" class="form-control" id="signTargetBase" value="' + targets.base + '"></div>' +
    '<div class="form-group"><label>卓越目标（单/月）</label>' +
    '<input type="number" class="form-control" id="signTargetStretch" value="' + targets.stretch + '"></div>';
  showModal('签约目标设置', html,
    '<button class="btn" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" onclick="saveSignTargets()">保存</button>');
}

function saveSignTargets() {
  var base = parseInt(document.getElementById('signTargetBase').value) || 10;
  var stretch = parseInt(document.getElementById('signTargetStretch').value) || 15;
  if (stretch <= base) { showToast('卓越目标必须大于基础目标'); return; }
  store.signTargets = { base: base, stretch: stretch };
  saveStore();
  closeModal();
  showToast('目标已保存');
  renderOpTabBody();
}

// v6.0 Card drag/resize/edit support (initialized on page load)
function initCardLayoutEnhancements() {
  // Double-click to edit card titles
  document.addEventListener('dblclick', function(e) {
    var h3 = e.target.closest('.card-header h3');
    if (!h3 || h3.querySelector('input')) return;
    var orig = h3.textContent.trim();
    var input = document.createElement('input');
    input.className = 'card-editable-title-input';
    input.value = orig;
    h3.textContent = '';
    h3.appendChild(input);
    input.focus();
    input.select();
    function save() {
      h3.textContent = input.value || orig;
      // Save custom title
      var card = h3.closest('.card');
      if (card && card.dataset.cardId) {
        if (!store.cardTitles) store.cardTitles = {};
        store.cardTitles[card.dataset.cardId] = input.value;
        saveStore();
      }
    }
    input.addEventListener('blur', save);
    input.addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); save(); }
      if (ev.key === 'Escape') { h3.textContent = orig; }
    });
  });
}
